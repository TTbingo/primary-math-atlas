<svg xmlns="http://www.w3.org/2000/svg" width="520" height="248" viewBox="0 0 520 248" role="img">
  <rect width="520" height="248" fill="#fffdf8"/>
  <defs>
    <marker id="ar-chase" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8f2419"/>
    </marker>
    <marker id="ab-chase" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f5d8a"/>
    </marker>
  </defs>

  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">追及：一个人补差距，速度要相减</text>

  <!-- 上面一条：乙在前，走得慢 -->
  <circle cx="300" cy="86" r="4" fill="#2f5d8a"/>
  <line x1="306" y1="86" x2="456" y2="86" stroke="#2f5d8a" stroke-width="2" marker-end="url(#ab-chase)"/>
  <text x="300" y="68" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#2f5d8a">乙 60 米/分（在前）</text>

  <!-- 两条路的起点差 -->
  <line x1="60" y1="112" x2="300" y2="112" stroke="#8a8578" stroke-width="1"/>
  <line x1="60" y1="106" x2="60" y2="118" stroke="#8a8578" stroke-width="1"/>
  <line x1="300" y1="106" x2="300" y2="118" stroke="#8a8578" stroke-width="1"/>
  <text x="180" y="104" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">开始时相差 600 米</text>

  <!-- 下面一条：甲在后，走得快 -->
  <circle cx="60" cy="144" r="4" fill="#8f2419"/>
  <line x1="66" y1="144" x2="456" y2="144" stroke="#8f2419" stroke-width="2" marker-end="url(#ar-chase)"/>
  <text x="60" y="132" font-family="'Noto Serif SC',serif" font-size="13" fill="#8f2419">甲 90 米/分（在后）</text>

  <text x="260" y="180" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#8f2419">每过 1 分，甲追近 90 − 60 = 30（米）</text>

  <rect x="86" y="196" width="348" height="36" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="260" y="220" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="15" fill="#8f2419">600 ÷ (90 − 60) = 20（分）</text>
</svg>
