<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">天平平衡，就是等式成立</text>
  <line x1="58" y1="110" x2="242" y2="110" stroke="#17181c" stroke-width="2.4"/>
  <polygon points="150,112 138,146 162,146" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <line x1="90" y1="110" x2="90" y2="140" stroke="#b9a888" stroke-width="1.2"/>
  <rect x="58" y="140" width="64" height="26" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="90" y="158" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">x + 3</text>
  <line x1="210" y1="110" x2="210" y2="140" stroke="#b9a888" stroke-width="1.2"/>
  <rect x="178" y="140" width="64" height="26" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="210" y="158" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">8</text>
  <line x1="298" y1="110" x2="482" y2="110" stroke="#17181c" stroke-width="2.4"/>
  <polygon points="390,112 378,146 402,146" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <line x1="330" y1="110" x2="330" y2="140" stroke="#b9a888" stroke-width="1.2"/>
  <rect x="298" y="140" width="64" height="26" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="330" y="158" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">x</text>
  <line x1="450" y1="110" x2="450" y2="140" stroke="#b9a888" stroke-width="1.2"/>
  <rect x="418" y="140" width="64" height="26" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="450" y="158" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">5</text>
  <text x="270" y="136" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">两边同时减 3</text>
  <text x="260" y="198" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">等式两边同时加上或减去同一个数，等式仍然成立</text>
  <text x="260" y="230" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#8f2419">x + 3 = 8  →  x = 8 - 3 = 5</text>
  <text x="260" y="262" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">检验：5 + 3 = 8，左右相等，x = 5 就是方程的解</text>
  <text x="260" y="292" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">含有未知数的等式叫方程；求方程的解的过程叫解方程</text>
</svg>
