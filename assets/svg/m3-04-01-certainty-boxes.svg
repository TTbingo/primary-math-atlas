<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">从盒子里任意摸出 1 个球，会摸到什么颜色？</text>
  <rect x="30" y="90" width="140" height="84" fill="#faf6ee" stroke="#b9a888" stroke-width="1.4"/>
  <circle cx="55" cy="132" r="13" fill="#c0392b" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="85" cy="132" r="13" fill="#c0392b" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="115" cy="132" r="13" fill="#c0392b" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="145" cy="132" r="13" fill="#c0392b" stroke="#17181c" stroke-width="1.1"/>
  <text x="100" y="194" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#8f2419">一定摸到红球</text>
  <text x="100" y="214" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">确定事件</text>
  <rect x="190" y="90" width="140" height="84" fill="#faf6ee" stroke="#b9a888" stroke-width="1.4"/>
  <circle cx="215" cy="132" r="13" fill="#c0392b" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="245" cy="132" r="13" fill="#c0392b" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="275" cy="132" r="13" fill="#c0392b" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="305" cy="132" r="13" fill="#f2ecdc" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="305" cy="132" r="13" fill="none" stroke="#17181c" stroke-width="1.1"/>
  <text x="260" y="194" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">可能摸到红球</text>
  <text x="260" y="214" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">不确定事件</text>
  <rect x="350" y="90" width="140" height="84" fill="#faf6ee" stroke="#b9a888" stroke-width="1.4"/>
  <circle cx="375" cy="132" r="13" fill="#f2ecdc" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="375" cy="132" r="13" fill="none" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="405" cy="132" r="13" fill="#f2ecdc" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="405" cy="132" r="13" fill="none" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="435" cy="132" r="13" fill="#f2ecdc" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="435" cy="132" r="13" fill="none" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="465" cy="132" r="13" fill="#f2ecdc" stroke="#17181c" stroke-width="1.1"/>
  <circle cx="465" cy="132" r="13" fill="none" stroke="#17181c" stroke-width="1.1"/>
  <text x="420" y="194" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#8f2419">不可能摸到红球</text>
  <text x="420" y="214" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">确定事件</text>
  <text x="260" y="258" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">一定能发生、一定不会发生，这两种都是确定事件；可能发生也可能不发生的，是不确定事件</text>
  <text x="260" y="278" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">中间那盒里红球有 3 个、白球只有 1 个，所以摸到红球的可能性大，摸到白球的可能性小</text>
  <text x="260" y="302" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">「可能性大」不等于「一定」：白球只有 1 个，也还是有可能摸到</text>
</svg>
