<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img">
  <defs>
    <pattern id="cell" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#ddd2ba" stroke-width="0.8"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="300" fill="#fffdf8"/>
  <text x="300" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">每条边都乘 2，形状不变；格子数乘 4，面积变 4 倍</text>

  <!-- 原图 3×2 -->
  <rect x="48" y="96" width="72" height="48" fill="url(#cell)"/>
  <rect x="48" y="96" width="72" height="48" fill="none" stroke="#bfa578" stroke-width="1.4"/>
  <text x="84" y="166" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c">长 3 格、宽 2 格</text>
  <text x="84" y="182" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">共 6 格</text>

  <line x1="150" y1="120" x2="286" y2="120" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="218" y="110" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#8f2419">按 2 : 1 放大</text>

  <!-- 放大后 6×4 -->
  <rect x="312" y="48" width="144" height="96" fill="url(#cell)"/>
  <rect x="312" y="48" width="144" height="96" fill="none" stroke="#bfa578" stroke-width="1.4"/>
  <line x1="384" y1="48" x2="384" y2="144" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="312" y1="96" x2="456" y2="96" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="348" y="76" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="9" fill="#5a5b60">3×2</text>
  <text x="420" y="76" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="9" fill="#5a5b60">3×2</text>
  <text x="348" y="126" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="9" fill="#5a5b60">3×2</text>
  <text x="420" y="126" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="9" fill="#5a5b60">3×2</text>
  <text x="384" y="166" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c">长 6 格、宽 4 格</text>
  <text x="384" y="182" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">共 24 格</text>

  <text x="300" y="212" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#17181c">① 长 3→6、宽 2→4，长与宽的比还是 3 : 2，四个角还是直角，形状没变</text>
  <text x="300" y="234" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#17181c">② 横着多一倍、竖着也多一倍，格子数 6→24，正好是 2 × 2 = 4 倍</text>
  <text x="300" y="260" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#8f2419">③ 只把长拉到 6 格、宽不动：格数变 12，图形却扁了 —— 那不是放大</text>
</svg>
