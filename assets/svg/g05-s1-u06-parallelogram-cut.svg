<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img">
  <defs>
    <marker id="arPC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f2419"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="320" fill="#fffdf8"/>
  <text x="280" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">沿高剪一刀，把三角形平移到右边，正好拼成长方形</text>

  <path d="M246,74 C 280,52 322,52 356,74" fill="none" stroke="#8f2419" stroke-width="1.6" marker-end="url(#arPC)"/>
  <text x="300" y="48" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">剪下这块，平移过去</text>

  <!-- 左：平行四边形与剪法 -->
  <polygon points="40,220 220,220 280,120 100,120" fill="#fdfdfb" stroke="#17181c" stroke-width="2"/>
  <polygon points="40,220 100,220 100,120" fill="#f5ddd8" stroke="#8f2419" stroke-width="2"/>
  <line x1="100" y1="120" x2="100" y2="220" stroke="#8f2419" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M100,208 L112,208 L112,220" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <text x="86" y="176" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#8f2419">h</text>

  <!-- 底 a -->
  <g stroke="#c0392b" stroke-width="1.4" fill="none">
    <line x1="40" y1="238" x2="220" y2="238"/>
    <line x1="40" y1="232" x2="40" y2="244"/>
    <line x1="220" y1="232" x2="220" y2="244"/>
  </g>
  <text x="130" y="258" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">底 a</text>

  <!-- 右：拼成的长方形 -->
  <rect x="360" y="120" width="180" height="100" fill="#fdfdfb" stroke="#17181c" stroke-width="2"/>
  <polygon points="480,220 540,220 540,120" fill="#f5ddd8" stroke="#8f2419" stroke-width="2"/>
  <path d="M528,220 L528,208 L540,208" fill="none" stroke="#17181c" stroke-width="1.2"/>

  <g stroke="#c0392b" stroke-width="1.4" fill="none">
    <line x1="360" y1="238" x2="540" y2="238"/>
    <line x1="360" y1="232" x2="360" y2="244"/>
    <line x1="540" y1="232" x2="540" y2="244"/>
  </g>
  <text x="450" y="258" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">长 = 底 a</text>

  <g stroke="#c0392b" stroke-width="1.4" fill="none">
    <line x1="344" y1="120" x2="344" y2="220"/>
    <line x1="338" y1="120" x2="350" y2="120"/>
    <line x1="338" y1="220" x2="350" y2="220"/>
  </g>
  <text x="332" y="176" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419" transform="rotate(-90 332 176)">宽 = 高 h</text>

  <text x="160" y="278" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">平行四边形：底 a、高 h</text>
  <text x="450" y="278" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">长方形：长 a、宽 h，面积没变</text>

  <rect x="16" y="288" width="528" height="26" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="280" y="306" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#8f2419">S = a × h　底 × 高，不用再乘 2，也不用除以 2</text>
</svg>
