<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">分配律：把 6 拆成 4 + 2，结果不变</text>
  <rect x="40" y="62" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="40" y="92" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="40" y="122" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="70" y="62" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="70" y="92" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="70" y="122" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="100" y="62" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="100" y="92" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="100" y="122" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="130" y="62" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="130" y="92" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="130" y="122" width="30" height="30" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="160" y="62" width="30" height="30" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <rect x="160" y="92" width="30" height="30" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <rect x="160" y="122" width="30" height="30" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <rect x="190" y="62" width="30" height="30" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <rect x="190" y="92" width="30" height="30" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <rect x="190" y="122" width="30" height="30" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <text x="100" y="125" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">4 × 3</text>
  <text x="190" y="125" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">2 × 3</text>
  <text x="130" y="52" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">4 + 2 = 6</text>
  <text x="26" y="107" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#7a7266">3</text>
  <text x="260" y="82" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">(4 + 2) × 3 = 6 × 3 = 18</text>
  <text x="260" y="112" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">4 × 3 + 2 × 3 = 12 + 6 = 18</text>
  <text x="260" y="146" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#8f2419">两边相等，这就是乘法分配律</text>
  <text x="260" y="182" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">交换律：a × b = b × a</text>
  <text x="260" y="208" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">结合律：(a×b)×c = a×(b×c)</text>
  <text x="260" y="250" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">用字母写更清楚：(a + b) × c = a × c + b × c</text>
  <text x="260" y="278" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">运算律能让计算变简单：25 × 13 × 4 = (25 × 4) × 13</text>
  <text x="260" y="304" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">先看清数之间的关系，再决定用哪条定律，别硬套</text>
</svg>
