<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">从 A、B、C 里选 2 人</text>
  <text x="145" y="62" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">只选出 2 人（不讲顺序）</text>
  <text x="385" y="62" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">选 2 人当正、副班长（讲顺序）</text>
  <rect x="40" y="76" width="210" height="150" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="145.0" y="155.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c"></text>
  <rect x="270" y="76" width="210" height="150" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="375.0" y="155.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c"></text>
  <rect x="70" y="104" width="52" height="34" rx="4" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.1"/>
  <text x="96" y="126" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">AB</text>
  <rect x="132" y="104" width="52" height="34" rx="4" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.1"/>
  <text x="158" y="126" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">AC</text>
  <rect x="194" y="104" width="52" height="34" rx="4" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.1"/>
  <text x="220" y="126" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">BC</text>
  <text x="145" y="190" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#8f2419">共 3 种</text>
  <rect x="292" y="96" width="52" height="32" rx="4" fill="#cfe0d0" stroke="#b9a888" stroke-width="1.1"/>
  <text x="318" y="117" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">AB</text>
  <rect x="354" y="96" width="52" height="32" rx="4" fill="#cfe0d0" stroke="#b9a888" stroke-width="1.1"/>
  <text x="380" y="117" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">BA</text>
  <rect x="416" y="96" width="52" height="32" rx="4" fill="#cfe0d0" stroke="#b9a888" stroke-width="1.1"/>
  <text x="442" y="117" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">AC</text>
  <rect x="292" y="140" width="52" height="32" rx="4" fill="#cfe0d0" stroke="#b9a888" stroke-width="1.1"/>
  <text x="318" y="161" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">CA</text>
  <rect x="354" y="140" width="52" height="32" rx="4" fill="#cfe0d0" stroke="#b9a888" stroke-width="1.1"/>
  <text x="380" y="161" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">BC</text>
  <rect x="416" y="140" width="52" height="32" rx="4" fill="#cfe0d0" stroke="#b9a888" stroke-width="1.1"/>
  <text x="442" y="161" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">CB</text>
  <text x="375" y="198" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#8f2419">共 6 种</text>
  <text x="260" y="250" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">同样是选 2 人，要不要排先后，结果差一倍</text>
  <text x="260" y="276" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">组合不管顺序；排列要分位置，可用 3 × 2 = 6 算</text>
