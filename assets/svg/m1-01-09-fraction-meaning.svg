<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">把单位「1」平均分</text>
  <path d="M 140,148 L 140,66 A 82,82 0 0 1 222,148 Z" fill="#e8dcc4" stroke="#17181c" stroke-width="1.4"/>
  <path d="M 140,148 L 222,148 A 82,82 0 0 1 140,230 Z" fill="#e8dcc4" stroke="#17181c" stroke-width="1.4"/>
  <path d="M 140,148 L 140,230 A 82,82 0 0 1 58,148 Z" fill="#e8dcc4" stroke="#17181c" stroke-width="1.4"/>
  <path d="M 140,148 L 58,148 A 82,82 0 0 1 140,66 Z" fill="#fffdf8" stroke="#17181c" stroke-width="1.4"/>
  <text x="140" y="248" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">平均分成 4 份，取 3 份 → 3/4</text>
  <text x="140" y="268" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">分数单位是 1/4</text>
  <rect x="300" y="130" width="36" height="36" fill="#e8dcc4" stroke="#17181c" stroke-width="1.4"/>
  <rect x="336" y="130" width="36" height="36" fill="#e8dcc4" stroke="#17181c" stroke-width="1.4"/>
  <rect x="372" y="130" width="36" height="36" fill="#e8dcc4" stroke="#17181c" stroke-width="1.4"/>
  <rect x="408" y="130" width="36" height="36" fill="#fffdf8" stroke="#17181c" stroke-width="1.4"/>
  <rect x="444" y="130" width="36" height="36" fill="#fffdf8" stroke="#17181c" stroke-width="1.4"/>
  <text x="390" y="248" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">平均分成 5 份，取 3 份 → 3/5</text>
  <text x="390" y="268" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">分数单位是 1/5</text>
  <text x="260" y="290" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">分母表示平均分成几份，分子表示取了几份；表示其中一份的数叫分数单位</text>
</svg>
