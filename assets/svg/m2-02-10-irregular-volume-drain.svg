<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img">
  <defs>
    <marker id="go" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8f2419"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="300" fill="#fffdf8"/>
  <text x="310" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">水面上升的那层水，就是物体占掉的空间</text>

  <!-- ① 装水 -->
  <text x="100" y="76" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" font-weight="bold" fill="#8f2419">① 先装水，记高度</text>
  <path d="M60 92 L60 230 L140 230 L140 92" fill="none" stroke="#9a9b9f" stroke-width="1.6"/>
  <rect x="60" y="160" width="80" height="70" fill="#d9e6ec"/>
  <line x1="60" y1="160" x2="140" y2="160" stroke="#7fa8b8" stroke-width="1.4"/>
  <line x1="52" y1="160" x2="60" y2="160" stroke="#5a5b60" stroke-width="1"/>
  <text x="100" y="250" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#5a5b60">水深 10 厘米</text>

  <line x1="150" y1="170" x2="226" y2="170" stroke="#8f2419" stroke-width="1.6" marker-end="url(#go)"/>
  <text x="188" y="160" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="9.5" fill="#8f2419">放入</text>

  <!-- ② 放入石块 -->
  <text x="290" y="76" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" font-weight="bold" fill="#8f2419">② 完全浸没，再记高度</text>
  <path d="M250 92 L250 230 L330 230 L330 92" fill="none" stroke="#9a9b9f" stroke-width="1.6"/>
  <rect x="250" y="146" width="80" height="84" fill="#d9e6ec"/>
  <line x1="250" y1="146" x2="330" y2="146" stroke="#7fa8b8" stroke-width="1.4"/>
  <line x1="242" y1="146" x2="250" y2="146" stroke="#5a5b60" stroke-width="1"/>
  <path d="M266 226 L272 206 L286 200 L302 208 L310 222 L308 230 L268 230 Z" fill="#b08968" stroke="#8a6748" stroke-width="1"/>
  <text x="290" y="250" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#5a5b60">水深 12 厘米，石块没有露出水面</text>

  <line x1="340" y1="170" x2="416" y2="170" stroke="#8f2419" stroke-width="1.6" marker-end="url(#go)"/>
  <text x="378" y="160" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="9.5" fill="#8f2419">相减</text>

  <!-- ③ 只看上升的那层 -->
  <text x="470" y="76" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" font-weight="bold" fill="#8f2419">③ 只看上升的那一层</text>
  <line x1="420" y1="146" x2="525" y2="146" stroke="#9a9b9f" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="420" y1="160" x2="525" y2="160" stroke="#9a9b9f" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="430" y="146" width="80" height="14" fill="#d9e6ec" stroke="#c0392b" stroke-width="1.4"/>
  <line x1="525" y1="146" x2="537" y2="146" stroke="#c0392b" stroke-width="1"/>
  <line x1="525" y1="160" x2="537" y2="160" stroke="#c0392b" stroke-width="1"/>
  <text x="541" y="157" font-family="'Noto Serif SC',serif" font-size="10" fill="#8f2419">2 厘米</text>
  <text x="470" y="192" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10" fill="#5a5b60">这一层水被挤上来的厚度</text>
  <text x="470" y="250" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#17181c">这层水的体积 = 石块的体积</text>

  <text x="310" y="280" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#17181c">底面积 300 平方厘米 × 上升 2 厘米 = 600 立方厘米</text>
</svg>
