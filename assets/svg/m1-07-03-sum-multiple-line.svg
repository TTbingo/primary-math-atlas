<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" role="img">
  <rect x="0" y="0" width="480" height="290" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">和倍问题：和里一共有 4 个同样大的份</text>

  <!-- 份数条：1 份 + 3 份 -->
  <text x="102" y="48" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#7a7266">小数 24（1 份）</text>
  <text x="270" y="48" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#7a7266">大数 72（3 份）</text>
  <rect x="60" y="56" width="84" height="28" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="144" y="56" width="84" height="28" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="228" y="56" width="84" height="28" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="312" y="56" width="84" height="28" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="102" y="75" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">1 份</text>
  <text x="186" y="75" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">1 份</text>
  <text x="270" y="75" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">1 份</text>
  <text x="354" y="75" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">1 份</text>

  <!-- 和的括号 -->
  <line x1="60" y1="96" x2="396" y2="96" stroke="#17181c" stroke-width="1.2"/>
  <line x1="60" y1="90" x2="60" y2="102" stroke="#17181c" stroke-width="1.2"/>
  <line x1="396" y1="90" x2="396" y2="102" stroke="#17181c" stroke-width="1.2"/>
  <text x="228" y="116" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">和 = 96 人，正好 1 + 3 = 4 份</text>

  <text x="240" y="144" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">4 份 → 96 人</text>
  <text x="240" y="166" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">1 份 → 96 ÷ 4 = 24 人（低声部）</text>
  <text x="240" y="188" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">3 份 → 24 × 3 = 72 人（高声部）</text>
  <text x="240" y="214" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">除数 4 是「倍数 3 + 小数自己那 1 份」，不是 3 − 1</text>
  <text x="240" y="238" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">验算：24 + 72 = 96，72 ÷ 24 = 3</text>
</svg>
