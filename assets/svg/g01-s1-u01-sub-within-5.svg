<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img">
  <rect x="0" y="0" width="480" height="240" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">从一堆里拿走几个，剩下的就是「还剩」</text>

  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#8f2419"/>
    </marker>
  </defs>

  <!-- 原来 5 个，右边 2 个被划掉拿走 -->
  <g>
    <rect x="28" y="46" width="240" height="70" rx="6" fill="#f3ede2" stroke="#cfc3ae"/>
    <circle cx="60" cy="81" r="12" fill="#f3e2c7" stroke="#b98a52" stroke-width="1.5"/>
    <circle cx="104" cy="81" r="12" fill="#f3e2c7" stroke="#b98a52" stroke-width="1.5"/>
    <circle cx="148" cy="81" r="12" fill="#f3e2c7" stroke="#b98a52" stroke-width="1.5"/>
    <circle cx="192" cy="81" r="12" fill="#faf4ea" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="236" cy="81" r="12" fill="#faf4ea" stroke="#c9b79c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="180" y1="69" x2="204" y2="93" stroke="#8f2419" stroke-width="1.6"/>
    <line x1="204" y1="69" x2="180" y2="93" stroke="#8f2419" stroke-width="1.6"/>
    <line x1="224" y1="69" x2="248" y2="93" stroke="#8f2419" stroke-width="1.6"/>
    <line x1="248" y1="69" x2="224" y2="93" stroke="#8f2419" stroke-width="1.6"/>
    <text x="148" y="132" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">原来有 5 个</text>
  </g>

  <!-- 拿走的箭头 -->
  <g stroke="#8f2419" stroke-width="1.6" fill="none" marker-end="url(#ar3)">
    <path d="M214,126 C214,148 214,152 214,160"/>
  </g>
  <text x="214" y="176" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#8f2419">划掉的 2 个被拿走</text>

  <text x="292" y="90" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="22" fill="#8f2419">=</text>

  <!-- 剩下 3 个 -->
  <g>
    <rect x="316" y="46" width="136" height="70" rx="6" fill="#fbeae8" stroke="#d9b3ad"/>
    <circle cx="350" cy="81" r="12" fill="#f3e2c7" stroke="#b98a52" stroke-width="1.5"/>
    <circle cx="390" cy="81" r="12" fill="#f3e2c7" stroke="#b98a52" stroke-width="1.5"/>
    <circle cx="430" cy="81" r="12" fill="#f3e2c7" stroke="#b98a52" stroke-width="1.5"/>
    <text x="384" y="132" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">还剩 3 个</text>
  </g>

  <!-- 底部算式 -->
  <rect x="40" y="192" width="180" height="36" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="130" y="215" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="18" fill="#8f2419">5 − 2 = 3</text>

  <rect x="240" y="192" width="200" height="36" rx="4" fill="#f3ede2" stroke="#cfc3ae"/>
  <text x="340" y="215" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">去掉的 2 + 剩下的 3 = 原来的 5</text>
</svg>
