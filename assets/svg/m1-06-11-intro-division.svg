  <rect x="414" y="190" width="38" height="34" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <text x="433.0" y="213" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">11</text>
  <rect x="452" y="190" width="38" height="34" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <text x="471.0" y="213" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">12</text>
  <line x1="34" y1="182" x2="34" y2="232" stroke="#8f2419" stroke-width="1.6"/>
  <line x1="186" y1="182" x2="186" y2="232" stroke="#8f2419" stroke-width="1.6"/>
  <line x1="338" y1="182" x2="338" y2="232" stroke="#8f2419" stroke-width="1.6"/>
  <line x1="490" y1="182" x2="490" y2="232" stroke="#8f2419" stroke-width="1.6"/>
  <text x="260" y="254" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#8f2419">每 4 个一份，能分成 3 份：12 ÷ 4 = 3</text>
  <text x="260" y="284" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">两种分法都是「平均分」，都用除法计算</text>
  <text x="260" y="308" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">总数 ÷ 份数 = 每份数；总数 ÷ 每份数 = 份数</text>
