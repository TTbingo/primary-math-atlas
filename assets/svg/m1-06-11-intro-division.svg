  <circle cx="398" cy="93" r="10" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.1"/>
  <circle cx="432" cy="93" r="10" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.1"/>
  <circle cx="466" cy="93" r="10" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.1"/>
  <text x="260" y="148" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#8f2419">平均分成 3 份，每份 4 个：12 ÷ 3 = 4</text>
  <rect x="34" y="190" width="38" height="34" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <text x="53.0" y="213" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">1</text>
  <rect x="72" y="190" width="38" height="34" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <text x="91.0" y="213" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">2</text>
  <rect x="110" y="190" width="38" height="34" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <text x="129.0" y="213" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">3</text>
  <rect x="148" y="190" width="38" height="34" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
