  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">把 12 个圆片平均分，有两种分法</text>
  <rect x="26" y="62" width="146" height="62" rx="6" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.3"/>
