  <rect x="262" y="190" width="38" height="34" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="281.0" y="213" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">7</text>
  <rect x="300" y="190" width="38" height="34" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
