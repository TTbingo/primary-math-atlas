  <text x="260" y="258" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">分母相同，每份就一样大：3 份 + 2 份 = 5 份</text>
  <text x="260" y="286" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">同分母分数相加减，分母不变，只把分子相加减；结果能约分的要约成最简分数</text>
