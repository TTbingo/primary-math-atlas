<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img">
  <rect x="0" y="0" width="480" height="260" fill="#fffdf8"/>
  <text x="240" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">把长方形铺满 1 平方厘米的小方格</text>

  <!-- 6 列 x 4 行 方格，每格 44px -->
  <g transform="translate(96,48)">
    <g stroke="#cfc3ae" stroke-width="1" fill="none">
      <rect x="0" y="0" width="264" height="176"/>
      <line x1="44" y1="0" x2="44" y2="176"/><line x1="88" y1="0" x2="88" y2="176"/>
      <line x1="132" y1="0" x2="132" y2="176"/><line x1="176" y1="0" x2="176" y2="176"/>
      <line x1="220" y1="0" x2="220" y2="176"/>
      <line x1="0" y1="44" x2="264" y2="44"/><line x1="0" y1="88" x2="264" y2="88"/>
      <line x1="0" y1="132" x2="264" y2="132"/>
    </g>
    <!-- 第一行标出 6 个 -->
    <g fill="#f5ddd8">
      <rect x="0" y="0" width="44" height="44"/><rect x="44" y="0" width="44" height="44"/>
      <rect x="88" y="0" width="44" height="44"/><rect x="132" y="0" width="44" height="44"/>
      <rect x="176" y="0" width="44" height="44"/><rect x="220" y="0" width="44" height="44"/>
    </g>
    <g stroke="#cfc3ae" stroke-width="1" fill="none">
      <rect x="0" y="0" width="264" height="176"/>
      <line x1="44" y1="0" x2="44" y2="176"/><line x1="88" y1="0" x2="88" y2="176"/>
      <line x1="132" y1="0" x2="132" y2="176"/><line x1="176" y1="0" x2="176" y2="176"/>
      <line x1="220" y1="0" x2="220" y2="176"/>
      <line x1="0" y1="44" x2="264" y2="44"/><line x1="0" y1="88" x2="264" y2="88"/>
      <line x1="0" y1="132" x2="264" y2="132"/>
    </g>
  </g>

  <!-- 长 = 每行 6 个 -->
  <g stroke="#c0392b" stroke-width="1.6" fill="none">
    <line x1="96" y1="238" x2="360" y2="238"/>
    <line x1="96" y1="232" x2="96" y2="244"/>
    <line x1="360" y1="232" x2="360" y2="244"/>
  </g>
  <text x="228" y="256" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#8f2419">长 6 厘米 → 每行 6 个方格</text>

  <!-- 宽 = 有 4 行 -->
  <g stroke="#c0392b" stroke-width="1.6" fill="none">
    <line x1="78" y1="48" x2="78" y2="224"/>
    <line x1="72" y1="48" x2="84" y2="48"/>
    <line x1="72" y1="224" x2="84" y2="224"/>
  </g>
  <text x="66" y="140" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#8f2419" transform="rotate(-90 66 140)">宽 4 厘米 → 有 4 行</text>

  <!-- 1 个方格标注 -->
  <rect x="0" y="48" width="0" height="0" fill="none"/>
  <text x="118" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8f2419">1cm²</text>
  <text x="398" y="128" font-family="'Noto Serif SC',serif" font-size="14" fill="#17181c">一共</text>
  <text x="398" y="152" font-family="'Noto Serif SC',serif" font-size="14" fill="#17181c">6 × 4 = 24</text>
  <text x="398" y="176" font-family="'Noto Serif SC',serif" font-size="14" fill="#17181c">个 1cm²</text>
</svg>
