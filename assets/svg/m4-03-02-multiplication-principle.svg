<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">2 件上衣、3 条裤子，有几种搭配？</text>
  <line x1="152" y1="100" x2="368" y2="72" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="152" y1="100" x2="368" y2="145" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="152" y1="100" x2="368" y2="218" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="152" y1="190" x2="368" y2="72" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="152" y1="190" x2="368" y2="145" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="152" y1="190" x2="368" y2="218" stroke="#cfc3ae" stroke-width="1"/>
  <circle cx="110" cy="100" r="24" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.3"/>
  <text x="110" y="104" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">上衣 A</text>
  <circle cx="110" cy="190" r="24" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.3"/>
  <text x="110" y="194" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">上衣 B</text>
  <circle cx="410" cy="72" r="24" fill="#cfe0d0" stroke="#b9a888" stroke-width="1.3"/>
  <text x="410" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">裤子 1</text>
  <circle cx="410" cy="145" r="24" fill="#cfe0d0" stroke="#b9a888" stroke-width="1.3"/>
  <text x="410" y="149" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">裤子 2</text>
  <circle cx="410" cy="218" r="24" fill="#cfe0d0" stroke="#b9a888" stroke-width="1.3"/>
  <text x="410" y="222" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">裤子 3</text>
  <text x="260" y="258" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#8f2419">2 × 3 = 6（种）</text>
  <text x="260" y="284" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">先选上衣 2 种，再选裤子 3 种；每一步的选法数相乘</text>
</svg>
