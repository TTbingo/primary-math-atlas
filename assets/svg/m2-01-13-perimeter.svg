<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">封闭图形一周的长度，是它的周长</text>
  <polygon points="60,180 150,90 240,180" fill="#f7f2e6" stroke="#c0392b" stroke-width="3"/>
  <text x="150" y="208" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">三角形</text>
  <rect x="300" y="100" width="160" height="80" fill="#f7f2e6" stroke="#c0392b" stroke-width="3"/>
  <text x="380" y="208" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">长方形</text>
  <path d="M 60,262 L 120,222 L 180,262 L 240,222" fill="none" stroke="#b9a888" stroke-width="3"/>
  <text x="150" y="288" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">没有围起来，就没有周长</text>
  <circle cx="380" cy="240" r="38" fill="#f7f2e6" stroke="#c0392b" stroke-width="3"/>
  <text x="380" y="294" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">圆</text>
  <text x="260" y="62" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">红色的一圈就是「一周」：从边上一点出发，沿着边走回原点</text>
</svg>
