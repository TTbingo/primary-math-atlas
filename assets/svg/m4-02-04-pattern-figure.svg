<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">数线段、数角，怎样不重不漏？</text>
  <line x1="40" y1="100" x2="240" y2="100" stroke="#17181c" stroke-width="2"/>
  <circle cx="40" cy="100" r="4" fill="#c0392b"/>
  <text x="40" y="122" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">A</text>
  <circle cx="90" cy="100" r="4" fill="#c0392b"/>
  <text x="90" y="122" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">B</text>
  <circle cx="140" cy="100" r="4" fill="#c0392b"/>
  <text x="140" y="122" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">C</text>
  <circle cx="190" cy="100" r="4" fill="#c0392b"/>
  <text x="190" y="122" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">D</text>
  <circle cx="240" cy="100" r="4" fill="#c0392b"/>
  <text x="240" y="122" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">E</text>
  <text x="140" y="152" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">以 A 起 4 条、B 起 3 条、C 起 2 条、D 起 1 条</text>
  <text x="140" y="180" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#8f2419">4 + 3 + 2 + 1 = 10（条）</text>
  <line x1="380" y1="190" x2="300" y2="90" stroke="#17181c" stroke-width="1.6"/>
  <line x1="380" y1="190" x2="350" y2="76" stroke="#17181c" stroke-width="1.6"/>
  <line x1="380" y1="190" x2="410" y2="76" stroke="#17181c" stroke-width="1.6"/>
  <line x1="380" y1="190" x2="460" y2="90" stroke="#17181c" stroke-width="1.6"/>
  <circle cx="380" cy="190" r="4" fill="#c0392b"/>
  <text x="380" y="212" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#8f2419">3 + 2 + 1 = 6（个角）</text>
  <text x="260" y="246" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">固定一个起点按顺序数，就不会数重，也不会漏</text>
  <text x="260" y="272" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">n 个点（或 n 条射线）都是 1 + 2 + … + (n-1)</text>
</svg>
