<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-label="年龄差不变示意图">
  <rect x="0" y="0" width="520" height="360" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">一起长大，多出来的那一段一直是 28 岁</text>

  <!-- 今年 -->
  <text x="56" y="96" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">今年</text>
  <rect x="120" y="80" width="304" height="22" rx="3" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="128" y="96" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">爸爸 38 岁</text>
  <rect x="120" y="112" width="80" height="22" rx="3" fill="#dfe6dd" stroke="#b6c0b2"/>
  <text x="128" y="128" font-family="'Noto Serif SC',serif" font-size="12" fill="#4a6b57">儿子 10</text>
  <line x1="200" y1="158" x2="424" y2="158" stroke="#8f2419" stroke-width="1.5"/>
  <line x1="200" y1="152" x2="200" y2="164" stroke="#8f2419" stroke-width="1.5"/>
  <line x1="424" y1="152" x2="424" y2="164" stroke="#8f2419" stroke-width="1.5"/>
  <text x="312" y="150" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">差 28 岁</text>

  <text x="260" y="196" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#8a7a66">两条横条同时往右长 1 格，长度差一点没变</text>

  <!-- 4 年后 -->
  <text x="56" y="244" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">4 年后</text>
  <rect x="120" y="228" width="336" height="22" rx="3" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="128" y="244" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">爸爸 42 岁</text>
  <text x="460" y="244" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">3 倍</text>
  <rect x="120" y="260" width="112" height="22" rx="3" fill="#dfe6dd" stroke="#b6c0b2"/>
  <text x="128" y="276" font-family="'Noto Serif SC',serif" font-size="12" fill="#4a6b57">儿子 14</text>
  <line x1="232" y1="306" x2="456" y2="306" stroke="#8f2419" stroke-width="1.5"/>
  <line x1="232" y1="300" x2="232" y2="312" stroke="#8f2419" stroke-width="1.5"/>
  <line x1="456" y1="300" x2="456" y2="312" stroke="#8f2419" stroke-width="1.5"/>
  <text x="344" y="298" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">还是 28 岁</text>

  <text x="260" y="340" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">28 ÷ (3 − 1) = 14（儿子那年），14 − 10 = 4 年后</text>
</svg>
