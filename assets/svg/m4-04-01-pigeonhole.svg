<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">4 个苹果放进 3 个抽屉</text>
  <text x="260" y="56" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">想一想：不管怎么放，总有一个抽屉里至少有几个？</text>
  <rect x="50" y="80" width="140" height="120" rx="4" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.5"/>
  <line x1="50" y1="104" x2="190" y2="104" stroke="#b9a888" stroke-width="1"/>
  <rect x="108" y="96" width="24" height="8" rx="3" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="120" y="220" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">第 1 个抽屉</text>
  <rect x="200" y="80" width="140" height="120" rx="4" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.5"/>
  <line x1="200" y1="104" x2="340" y2="104" stroke="#b9a888" stroke-width="1"/>
  <rect x="258" y="96" width="24" height="8" rx="3" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="270" y="220" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">第 2 个抽屉</text>
  <rect x="350" y="80" width="140" height="120" rx="4" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.5"/>
  <line x1="350" y1="104" x2="490" y2="104" stroke="#b9a888" stroke-width="1"/>
  <rect x="408" y="96" width="24" height="8" rx="3" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="420" y="220" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">第 3 个抽屉</text>
  <circle cx="90" cy="150" r="17" fill="#e2a99c" stroke="#8f2419" stroke-width="1.3"/>
  <line x1="90" y1="133" x2="93" y2="125" stroke="#4a7c59" stroke-width="2"/>
  <circle cx="145" cy="150" r="17" fill="#e2a99c" stroke="#8f2419" stroke-width="1.3"/>
  <line x1="145" y1="133" x2="148" y2="125" stroke="#4a7c59" stroke-width="2"/>
  <circle cx="270" cy="150" r="17" fill="#e2a99c" stroke="#8f2419" stroke-width="1.3"/>
  <line x1="270" y1="133" x2="273" y2="125" stroke="#4a7c59" stroke-width="2"/>
  <circle cx="420" cy="150" r="17" fill="#e2a99c" stroke="#8f2419" stroke-width="1.3"/>
  <line x1="420" y1="133" x2="423" y2="125" stroke="#4a7c59" stroke-width="2"/>
  <text x="260" y="248" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">先尽量平均分：每个抽屉放 1 个，用掉 3 个，还剩 1 个</text>
  <text x="260" y="274" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">剩下的那个不管放进哪个抽屉，那个抽屉就有 2 个</text>
  <text x="260" y="300" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">所以总有一个抽屉里不少于 2 个：物体比抽屉多就行</text>
</svg>
