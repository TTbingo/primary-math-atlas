<svg xmlns="http://www.w3.org/2000/svg" width="520" height="326" viewBox="0 0 520 326" role="img">
  <rect x="0" y="0" width="520" height="326" fill="#fffdf8"/>
  <text x="260.0" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">展开图上，隔着一个面的两个面就是相对面</text>
  <rect x="20" y="118" width="78" height="78" fill="#cfe3d4" stroke="#17181c" stroke-width="1.5"/>
  <text x="59.0" y="162.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">左面</text>
  <rect x="98" y="118" width="78" height="78" fill="#f3ead6" stroke="#17181c" stroke-width="1.5"/>
  <text x="137.0" y="162.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">前面</text>
  <rect x="176" y="118" width="78" height="78" fill="#cfe3d4" stroke="#17181c" stroke-width="1.5"/>
  <text x="215.0" y="162.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">右面</text>
  <rect x="254" y="118" width="78" height="78" fill="#f3ead6" stroke="#17181c" stroke-width="1.5"/>
  <text x="293.0" y="162.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">后面</text>
  <rect x="98" y="40" width="78" height="78" fill="#f6d9d2" stroke="#17181c" stroke-width="1.5"/>
  <text x="137.0" y="84.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">上面</text>
  <rect x="98" y="196" width="78" height="78" fill="#f6d9d2" stroke="#17181c" stroke-width="1.5"/>
  <text x="137.0" y="240.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">下面</text>
  <rect x="360" y="60" width="150" height="140" fill="#fdf6e8" stroke="#cfc3ae" stroke-width="1"/>
  <rect x="372" y="71" width="16" height="16" fill="#cfe3d4" stroke="#17181c" stroke-width="1"/>
  <text x="396" y="84" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">左 ↔ 右</text>
  <rect x="372" y="101" width="16" height="16" fill="#f3ead6" stroke="#17181c" stroke-width="1"/>
  <text x="396" y="114" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">前 ↔ 后</text>
  <rect x="372" y="131" width="16" height="16" fill="#f6d9d2" stroke="#17181c" stroke-width="1"/>
  <text x="396" y="144" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">上 ↔ 下</text>
  <line x1="368" y1="166" x2="498" y2="166" stroke="#cfc3ae" stroke-width="0.8"/>
  <text x="372" y="188" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#c0392b">颜色相同 = 相对面</text>
  <text x="20" y="310" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#555962">相对面在展开图上永远不相邻，中间总隔着另一个面</text>
</svg>
