<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">用正数和负数表示相反意义的量</text>
  <defs><marker id="pnArr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#17181c"/></marker></defs>
  <line x1="40" y1="130" x2="480" y2="130" stroke="#17181c" stroke-width="1.6" marker-end="url(#pnArr)"/>
  <line x1="40" y1="123" x2="40" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="40" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2b6cb0">-5</text>
  <line x1="84" y1="123" x2="84" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="84" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2b6cb0">-4</text>
  <line x1="128" y1="123" x2="128" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="128" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2b6cb0">-3</text>
  <line x1="172" y1="123" x2="172" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="172" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2b6cb0">-2</text>
  <line x1="216" y1="123" x2="216" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="216" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2b6cb0">-1</text>
  <line x1="260" y1="123" x2="260" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="260" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">0</text>
  <line x1="304" y1="123" x2="304" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="304" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">1</text>
  <line x1="348" y1="123" x2="348" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="348" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">2</text>
  <line x1="392" y1="123" x2="392" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="392" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">3</text>
  <line x1="436" y1="123" x2="436" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="436" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">4</text>
  <line x1="480" y1="123" x2="480" y2="137" stroke="#17181c" stroke-width="1.2"/>
  <text x="480" y="116" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">5</text>
  <circle cx="260" cy="130" r="4.5" fill="#17181c"/>
  <line x1="260" y1="58" x2="260" y2="176" stroke="#bfa578" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="260" y="50" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7a7266">分界</text>
  <text x="140" y="182" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2b6cb0">负数（比 0 小）</text>
  <text x="390" y="182" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">正数（比 0 大）</text>
  <text x="145" y="220" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">零下 5℃ → -5℃</text>
  <text x="145" y="246" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">支出 200 元 → -200</text>
  <text x="385" y="220" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">零上 5℃ → +5℃</text>
  <text x="385" y="246" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">收入 200 元 → +200</text>
  <text x="260" y="282" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">0 既不是正数，也不是负数，它是正与负的分界</text>
  <text x="260" y="306" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">数轴上从左往右越来越大，所以 正数 &gt; 0 &gt; 负数</text>
</svg>
