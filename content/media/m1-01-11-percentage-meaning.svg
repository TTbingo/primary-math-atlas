  <text x="270" y="84" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">全班 40 人，女生 18 人</text>
  <text x="270" y="120" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#8f2419">18 ÷ 40 = 0.45 = 45%</text>
  <text x="270" y="152" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">100 格里涂 45 格，就是 45%</text>
  <text x="270" y="182" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">百分数表示两个数的比</text>
  <text x="270" y="208" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">也叫百分率、百分比</text>
  <text x="270" y="240" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">45% 只表示关系，不能带单位</text>
  <text x="260" y="286" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">百分数是分母固定为 100 的另一种写法，便于比较大小</text>
  <text x="260" y="308" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">写作 45%，不能写成「45% 人」；「谁占谁的百分之几」要先说清单位「1」</text>
