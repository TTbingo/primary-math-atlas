<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
  <rect x="0" y="0" width="640" height="360" fill="#fffdf8"/>
  <text x="320" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">把圆平均分成 16 份，交错拼起来，就接近一个长方形</text>

  <!-- 左：分成 16 份的圆 -->
  <circle cx="132" cy="160" r="82" fill="#fdfbf8" stroke="#b98c81" stroke-width="1"/>
  <path d="M132,160 L132,78 A82,82 0 0 1 163.4,84.2 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L163.4,84.2 A82,82 0 0 1 190,102 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L190,102 A82,82 0 0 1 207.8,128.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L207.8,128.6 A82,82 0 0 1 214,160 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L214,160 A82,82 0 0 1 207.8,191.4 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L207.8,191.4 A82,82 0 0 1 190,218 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L190,218 A82,82 0 0 1 163.4,235.8 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L163.4,235.8 A82,82 0 0 1 132,242 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L132,242 A82,82 0 0 1 100.6,235.8 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L100.6,235.8 A82,82 0 0 1 74,218 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L74,218 A82,82 0 0 1 56.2,191.4 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L56.2,191.4 A82,82 0 0 1 50,160 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L50,160 A82,82 0 0 1 56.2,128.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L56.2,128.6 A82,82 0 0 1 74,102 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L74,102 A82,82 0 0 1 100.6,84.2 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
  <path d="M132,160 L100.6,84.2 A82,82 0 0 1 132,78 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
  <line x1="132" y1="160" x2="214" y2="160" stroke="#8f2419" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="176" y="152" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#8f2419">r</text>
  <circle cx="132" cy="160" r="2.2" fill="#17181c"/>
  <text x="132" y="264" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">平均分成 16 份小扇形，每份的直边都是 r</text>

  <!-- 箭头 -->
  <defs>
    <marker id="arCC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f2419"/>
    </marker>
  </defs>
  <path d="M228,168 L292,168" fill="none" stroke="#8f2419" stroke-width="1.6" marker-end="url(#arCC)"/>
  <text x="258" y="156" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">剪开</text>
  <text x="258" y="186" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">交错拼</text>

  <!-- 右：拼成的近似长方形（上下边各 ≈ πr，左右微斜） -->
  <g transform="translate(320,112)">
    <path d="M0,0 L256,0 L272,83.6 L16,83.6 Z" fill="none" stroke="#8f2419" stroke-width="1" stroke-dasharray="5 4"/>
    <path d="M16,82 L0,1.6 Q16,-1.6 32,1.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M32,1.6 L16,82 Q32,83.6 48,82 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M48,82 L32,1.6 Q48,-1.6 64,1.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M64,1.6 L48,82 Q64,83.6 80,82 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M80,82 L64,1.6 Q80,-1.6 96,1.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M96,1.6 L80,82 Q96,83.6 112,82 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M112,82 L96,1.6 Q112,-1.6 128,1.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M128,1.6 L112,82 Q128,83.6 144,82 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M144,82 L128,1.6 Q144,-1.6 160,1.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M160,1.6 L144,82 Q160,83.6 176,82 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M176,82 L160,1.6 Q176,-1.6 192,1.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M192,1.6 L176,82 Q192,83.6 208,82 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M208,82 L192,1.6 Q208,-1.6 224,1.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M224,1.6 L208,82 Q224,83.6 240,82 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M240,82 L224,1.6 Q240,-1.6 256,1.6 Z" fill="#e2a99d" stroke="#b98c81" stroke-width="0.7"/>
    <path d="M256,1.6 L240,82 Q256,83.6 272,82 Z" fill="#f9eae6" stroke="#b98c81" stroke-width="0.7"/>
  </g>
  <line x1="336" y1="209.6" x2="592" y2="209.6" stroke="#8f2419" stroke-width="1.3"/>
  <line x1="336" y1="204.6" x2="336" y2="214.6" stroke="#8f2419" stroke-width="1.3"/>
  <line x1="592" y1="204.6" x2="592" y2="214.6" stroke="#8f2419" stroke-width="1.3"/>
  <text x="464" y="229.6" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#8f2419">长 ≈ 圆周长的一半 = πr</text>
  <line x1="306" y1="112" x2="306" y2="195.6" stroke="#8f2419" stroke-width="1.3"/>
  <line x1="301" y1="112" x2="311" y2="112" stroke="#8f2419" stroke-width="1.3"/>
  <line x1="301" y1="195.6" x2="311" y2="195.6" stroke="#8f2419" stroke-width="1.3"/>
  <text x="296" y="153.8" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12.5" fill="#8f2419" transform="rotate(-90 296 153.8)">宽 = r</text>
  <text x="464" y="251.6" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#17181c">分的份数越多，锯齿越小，越接近长方形</text>

  <rect x="16" y="292" width="608" height="52" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="320" y="315" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="15" fill="#8f2419">S = πr × r = πr²　（剪拼只是搬家，面积没多也没少）</text>
  <text x="320" y="335" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c">长方形的长 = πr，宽 = r，用「长 × 宽」就得到圆的面积</text>
</svg>
