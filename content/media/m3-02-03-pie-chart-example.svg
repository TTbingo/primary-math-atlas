<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">六(1)班 40 人最喜欢的社团统计图</text>
  <path d="M 168,158 L 168,50 A 108,108 0 0 1 276,158 Z" fill="#e8dcc4" stroke="#fffdf8" stroke-width="2"/>
  <text x="213.8" y="116.2" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">25%</text>
  <path d="M 168,158 L 276,158 A 108,108 0 0 1 134.6,260.7 Z" fill="#cfe0d0" stroke="#fffdf8" stroke-width="2"/>
  <text x="206.1" y="214.4" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">30%</text>
  <path d="M 168,158 L 134.6,260.7 A 108,108 0 0 1 60,158 Z" fill="#d8e2ef" stroke="#fffdf8" stroke-width="2"/>
  <text x="115.6" y="200.1" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">20%</text>
  <path d="M 168,158 L 60,158 A 108,108 0 0 1 104.5,70.6 Z" fill="#eed8d2" stroke="#fffdf8" stroke-width="2"/>
  <text x="98.7" y="126.7" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">15%</text>
  <path d="M 168,158 L 104.5,70.6 A 108,108 0 0 1 168,50 Z" fill="#e5dcef" stroke="#fffdf8" stroke-width="2"/>
  <text x="144" y="88" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">10%</text>
  <rect x="312" y="75" width="16" height="14" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="340" y="86" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">阅读</text>
  <text x="470" y="86" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">25%  10人</text>
  <rect x="312" y="105" width="16" height="14" fill="#cfe0d0" stroke="#b9a888" stroke-width="1"/>
  <text x="340" y="116" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">运动</text>
  <text x="470" y="116" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">30%  12人</text>
  <rect x="312" y="135" width="16" height="14" fill="#d8e2ef" stroke="#b9a888" stroke-width="1"/>
  <text x="340" y="146" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">绘画</text>
  <text x="470" y="146" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">20%  8人</text>
  <rect x="312" y="165" width="16" height="14" fill="#eed8d2" stroke="#b9a888" stroke-width="1"/>
  <text x="340" y="176" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">音乐</text>
  <text x="470" y="176" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">15%  6人</text>
  <rect x="312" y="195" width="16" height="14" fill="#e5dcef" stroke="#b9a888" stroke-width="1"/>
  <text x="340" y="206" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">其他</text>
  <text x="470" y="206" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">10%  4人</text>
  <text x="390" y="250" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">整个圆 = 总人数 40 人</text>
  <text x="390" y="268" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">扇形大小 = 占百分之几</text>
  <text x="260" y="296" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">整个圆表示总数量，每个扇形表示其中一部分占总数的百分之几</text>
  <text x="260" y="314" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">25% + 30% + 20% + 15% + 10% = 100%：所有扇形拼起来正好是一个整圆</text>
</svg>
