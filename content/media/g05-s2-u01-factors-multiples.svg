<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img">
  <rect x="0" y="0" width="480" height="240" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">12 个点摆长方形：3 种摆法，6 个因数</text>

  <!-- 1 x 12 -->
  <g fill="#8f2419">
    <circle cx="26" cy="60" r="4.2"/><circle cx="40" cy="60" r="4.2"/><circle cx="54" cy="60" r="4.2"/>
    <circle cx="68" cy="60" r="4.2"/><circle cx="82" cy="60" r="4.2"/><circle cx="96" cy="60" r="4.2"/>
    <circle cx="110" cy="60" r="4.2"/><circle cx="124" cy="60" r="4.2"/><circle cx="138" cy="60" r="4.2"/>
    <circle cx="152" cy="60" r="4.2"/><circle cx="166" cy="60" r="4.2"/><circle cx="180" cy="60" r="4.2"/>
  </g>
  <text x="103" y="100" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">1 × 12</text>

  <!-- 2 x 6 -->
  <g fill="#8f2419">
    <circle cx="212" cy="51" r="4.2"/><circle cx="228" cy="51" r="4.2"/><circle cx="244" cy="51" r="4.2"/>
    <circle cx="260" cy="51" r="4.2"/><circle cx="276" cy="51" r="4.2"/><circle cx="292" cy="51" r="4.2"/>
    <circle cx="212" cy="69" r="4.2"/><circle cx="228" cy="69" r="4.2"/><circle cx="244" cy="69" r="4.2"/>
    <circle cx="260" cy="69" r="4.2"/><circle cx="276" cy="69" r="4.2"/><circle cx="292" cy="69" r="4.2"/>
  </g>
  <text x="252" y="100" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">2 × 6</text>

  <!-- 3 x 4 -->
  <g fill="#8f2419">
    <circle cx="356" cy="42" r="4.2"/><circle cx="372" cy="42" r="4.2"/><circle cx="388" cy="42" r="4.2"/><circle cx="404" cy="42" r="4.2"/>
    <circle cx="356" cy="60" r="4.2"/><circle cx="372" cy="60" r="4.2"/><circle cx="388" cy="60" r="4.2"/><circle cx="404" cy="60" r="4.2"/>
    <circle cx="356" cy="78" r="4.2"/><circle cx="372" cy="78" r="4.2"/><circle cx="388" cy="78" r="4.2"/><circle cx="404" cy="78" r="4.2"/>
  </g>
  <text x="380" y="100" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">3 × 4</text>

  <line x1="20" y1="112" x2="460" y2="112" stroke="#cfc3ae" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 左：因数 -->
  <text x="24" y="136" font-family="'Noto Serif SC',serif" font-size="13" font-weight="bold" fill="#8f2419">12 的因数</text>
  <text x="24" y="160" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">1、2、3、4、6、12</text>
  <text x="24" y="184" font-family="'Noto Serif SC',serif" font-size="12" fill="#5a5b60">一共 6 个，数得清</text>
  <text x="24" y="206" font-family="'Noto Serif SC',serif" font-size="12" fill="#5a5b60">最小 1，最大 12（它本身）</text>

  <line x1="256" y1="120" x2="256" y2="212" stroke="#cfc3ae" stroke-width="1"/>

  <!-- 右：倍数 -->
  <text x="272" y="136" font-family="'Noto Serif SC',serif" font-size="13" font-weight="bold" fill="#8f2419">3 的倍数</text>
  <text x="272" y="160" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">3、6、9、12、15…</text>
  <text x="272" y="184" font-family="'Noto Serif SC',serif" font-size="12" fill="#5a5b60">一直写下去，数不完</text>
  <text x="272" y="206" font-family="'Noto Serif SC',serif" font-size="12" fill="#5a5b60">最小 3（它本身），没有最大</text>
</svg>
