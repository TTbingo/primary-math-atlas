<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img">
  <rect x="0" y="0" width="480" height="260" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">把三个内角撕下来，拼在一条直线上</text>

  <!-- 左：三角形，三个角涂色 -->
  <polygon points="40,200 160,200 85,100" fill="#f7f2e6" stroke="#17181c" stroke-width="1.6"/>
  <path d="M40,200 L62,200 A22,22 0 0 0 49,179.9 Z" fill="#c0503f" fill-opacity="0.55" stroke="#8f2419" stroke-width="1"/>
  <path d="M160,200 L138,200 A22,22 0 0 1 146.8,182.4 Z" fill="#3d6f96" fill-opacity="0.55" stroke="#2f5b7c" stroke-width="1"/>
  <path d="M85,100 L95.8,114.4 A18,18 0 0 1 77.6,116.4 Z" fill="#5c8a5f" fill-opacity="0.55" stroke="#3f6b45" stroke-width="1"/>
  <text x="58" y="196" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">①</text>
  <text x="141" y="196" font-family="'Noto Serif SC',serif" font-size="11" fill="#2f5b7c">②</text>
  <text x="84" y="128" font-family="'Noto Serif SC',serif" font-size="11" fill="#3f6b45">③</text>
  <text x="100" y="222" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#7a7266">一个三角形，三个内角</text>

  <!-- 撕下示意箭头 -->
  <path d="M170,152 C196,140 200,130 214,124" fill="none" stroke="#cfc3ae" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M214,124 L206,126 L211,133 Z" fill="#cfc3ae"/>

  <!-- 右：三个角拼成平角 -->
  <path d="M260,170 L345,170 A85,85 0 0 0 294.9,92.5 Z" fill="#c0503f" fill-opacity="0.5" stroke="#8f2419" stroke-width="1"/>
  <path d="M260,170 L294.9,92.5 A85,85 0 0 0 218.9,95.6 Z" fill="#3d6f96" fill-opacity="0.5" stroke="#2f5b7c" stroke-width="1"/>
  <path d="M260,170 L218.9,95.6 A85,85 0 0 0 175,170 Z" fill="#5c8a5f" fill-opacity="0.5" stroke="#3f6b45" stroke-width="1"/>
  <line x1="168" y1="170" x2="356" y2="170" stroke="#17181c" stroke-width="1.6"/>
  <circle cx="260" cy="170" r="2.4" fill="#17181c"/>
  <text x="305" y="140" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">①</text>
  <text x="262" y="108" font-family="'Noto Serif SC',serif" font-size="11" fill="#2f5b7c">②</text>
  <text x="212" y="140" font-family="'Noto Serif SC',serif" font-size="11" fill="#3f6b45">③</text>
  <text x="262" y="196" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#7a7266">顶点对在一起，边挨着边</text>
  <text x="262" y="224" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#8f2419">拼满直线一侧 = 平角 = 180°</text>
</svg>
