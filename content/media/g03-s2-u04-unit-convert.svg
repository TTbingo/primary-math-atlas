<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img">
  <rect x="0" y="0" width="480" height="240" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">1 平方分米里能铺多少个 1 平方厘米？</text>

  <!-- 1 dm = 10 cm 的方格 -->
  <g transform="translate(60,38)">
    <rect x="0" y="0" width="160" height="160" fill="#f5ddd8" stroke="#8f2419" stroke-width="2"/>
    <g stroke="#cfc3ae" stroke-width="1" fill="none">
      <line x1="16" y1="0" x2="16" y2="160"/><line x1="32" y1="0" x2="32" y2="160"/>
      <line x1="48" y1="0" x2="48" y2="160"/><line x1="64" y1="0" x2="64" y2="160"/>
      <line x1="80" y1="0" x2="80" y2="160"/><line x1="96" y1="0" x2="96" y2="160"/>
      <line x1="112" y1="0" x2="112" y2="160"/><line x1="128" y1="0" x2="128" y2="160"/>
      <line x1="144" y1="0" x2="144" y2="160"/>
      <line x1="0" y1="16" x2="160" y2="16"/><line x1="0" y1="32" x2="160" y2="32"/>
      <line x1="0" y1="48" x2="160" y2="48"/><line x1="0" y1="64" x2="160" y2="64"/>
      <line x1="0" y1="80" x2="160" y2="80"/><line x1="0" y1="96" x2="160" y2="96"/>
      <line x1="0" y1="112" x2="160" y2="112"/><line x1="0" y1="128" x2="160" y2="128"/>
      <line x1="0" y1="144" x2="160" y2="144"/>
    </g>
    <text x="80" y="176" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#8f2419">边长 1 分米 = 10 厘米</text>
    <text x="80" y="196" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#17181c">10 × 10 = 100 个 1cm²</text>
  </g>

  <!-- 换算带 -->
  <g transform="translate(276,64)">
    <rect x="0" y="0" width="164" height="40" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
    <text x="82" y="26" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="15" fill="#8f2419">1 dm² = 100 cm²</text>
    <rect x="0" y="52" width="164" height="40" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
    <text x="82" y="78" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="15" fill="#8f2419">1 m² = 100 dm²</text>
    <rect x="0" y="104" width="164" height="40" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
    <text x="82" y="130" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="15" fill="#8f2419">1 ha = 10000 m²</text>
  </g>
  <text x="358" y="222" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#555962">长度进率是 10，面积进率是 10 × 10</text>
</svg>
