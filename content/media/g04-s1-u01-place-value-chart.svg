<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img">
  <rect x="0" y="0" width="480" height="240" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">数位顺序表：从右边起，每四位分一级</text>

  <!-- 数级行 -->
  <rect x="32" y="44" width="208" height="28" fill="#f5ddd8" stroke="#cfc3ae"/>
  <rect x="240" y="44" width="208" height="28" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="136" y="63" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#8f2419">万级</text>
  <text x="344" y="63" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#8f2419">个级</text>

  <!-- 数位行 -->
  <g stroke="#cfc3ae" stroke-width="1" fill="#fffdf8">
    <rect x="32" y="72" width="52" height="30"/><rect x="84" y="72" width="52" height="30"/>
    <rect x="136" y="72" width="52" height="30"/><rect x="188" y="72" width="52" height="30"/>
    <rect x="240" y="72" width="52" height="30"/><rect x="292" y="72" width="52" height="30"/>
    <rect x="344" y="72" width="52" height="30"/><rect x="396" y="72" width="52" height="30"/>
  </g>
  <g text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">
    <text x="58" y="92">千万</text><text x="110" y="92">百万</text>
    <text x="162" y="92">十万</text><text x="214" y="92">万</text>
    <text x="266" y="92">千</text><text x="318" y="92">百</text>
    <text x="370" y="92">十</text><text x="422" y="92">个</text>
  </g>

  <!-- 数字行 -->
  <g stroke="#cfc3ae" stroke-width="1" fill="#f5ddd8">
    <rect x="32" y="102" width="52" height="40"/><rect x="84" y="102" width="52" height="40"/>
    <rect x="136" y="102" width="52" height="40"/><rect x="188" y="102" width="52" height="40"/>
    <rect x="240" y="102" width="52" height="40"/><rect x="292" y="102" width="52" height="40"/>
    <rect x="344" y="102" width="52" height="40"/><rect x="396" y="102" width="52" height="40"/>
  </g>
  <g text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="22" fill="#8f2419">
    <text x="58" y="131">4</text><text x="110" y="131">0</text>
    <text x="162" y="131">5</text><text x="214" y="131">0</text>
    <text x="266" y="131">6</text><text x="318" y="131">0</text>
    <text x="370" y="131">0</text><text x="422" y="131">0</text>
  </g>

  <!-- 分级线 -->
  <line x1="240" y1="44" x2="240" y2="142" stroke="#8f2419" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="246" y="156" font-family="'Noto Serif SC',serif" font-size="10" fill="#8f2419">分级线</text>

  <text x="240" y="180" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#17181c">40506000 读作：四千零五十万六千</text>
  <text x="240" y="202" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">万级说「多少个万」，个级说「多少个一」</text>
  <text x="240" y="222" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">每级末尾的 0 都不读，其他位置只读一个零</text>
</svg>
