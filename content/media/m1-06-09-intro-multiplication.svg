<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">每盘 3 个，有 4 盘，一共几个？</text>
  <rect x="30" y="76" width="104" height="76" rx="8" fill="#faf6ee" stroke="#b9a888" stroke-width="1.4"/>
  <circle cx="52" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <circle cx="82" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <circle cx="112" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <rect x="152" y="76" width="104" height="76" rx="8" fill="#faf6ee" stroke="#b9a888" stroke-width="1.4"/>
  <circle cx="174" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <circle cx="204" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <circle cx="234" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <rect x="274" y="76" width="104" height="76" rx="8" fill="#faf6ee" stroke="#b9a888" stroke-width="1.4"/>
  <circle cx="296" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <circle cx="326" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <circle cx="356" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <rect x="396" y="76" width="104" height="76" rx="8" fill="#faf6ee" stroke="#b9a888" stroke-width="1.4"/>
  <circle cx="418" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <circle cx="448" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <circle cx="478" cy="114" r="11" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <text x="260" y="184" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">3 + 3 + 3 + 3 = 12</text>
  <text x="260" y="216" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#8f2419">4 个 3 相加  →  3 × 4 = 12</text>
  <text x="260" y="244" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">3 是每盘的个数，4 是盘数</text>
  <text x="260" y="274" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">求几个相同加数的和，用乘法算更简便</text>
  <text x="260" y="296" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">3 × 4 读作「3 乘 4」，3 和 4 都叫因数，12 叫积</text>
</svg>
