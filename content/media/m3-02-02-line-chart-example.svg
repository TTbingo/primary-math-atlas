<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img">
  <rect x="0" y="0" width="480" height="320" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">小舟一周的手机步数（步）</text>

  <!-- 网格 -->
  <g stroke="#e6ddcc" stroke-width="0.8">
    <line x1="78" y1="212" x2="450" y2="212"/>
    <line x1="78" y1="174" x2="450" y2="174"/>
    <line x1="78" y1="136" x2="450" y2="136"/>
    <line x1="78" y1="98" x2="450" y2="98"/>
    <line x1="78" y1="60" x2="450" y2="60"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="78" y1="60" x2="78" y2="250" stroke="#17181c" stroke-width="1.2"/>
  <line x1="78" y1="250" x2="450" y2="250" stroke="#17181c" stroke-width="1.2"/>

  <!-- 纵轴刻度 -->
  <g font-family="'Noto Serif SC',serif" font-size="10" fill="#7a7266" text-anchor="end">
    <text x="70" y="253">0</text>
    <text x="70" y="215">2000</text>
    <text x="70" y="177">4000</text>
    <text x="70" y="139">6000</text>
    <text x="70" y="101">8000</text>
    <text x="70" y="63">10000</text>
  </g>
  <text x="44" y="56" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">步</text>

  <!-- 折线 -->
  <polyline points="100,170.2 156.7,153.1 213.3,177.8 270,130.3 326.7,113.2 383.3,77.1 440,86.6"
            fill="none" stroke="#8f2419" stroke-width="1.8"/>

  <!-- 数据点 -->
  <g fill="#8f2419">
    <circle cx="100" cy="170.2" r="3.6"/>
    <circle cx="156.7" cy="153.1" r="3.6"/>
    <circle cx="213.3" cy="177.8" r="3.6"/>
    <circle cx="270" cy="130.3" r="3.6"/>
    <circle cx="326.7" cy="113.2" r="3.6"/>
    <circle cx="383.3" cy="77.1" r="3.6"/>
    <circle cx="440" cy="86.6" r="3.6"/>
  </g>

  <!-- 点旁标数 -->
  <g font-family="'Noto Serif SC',serif" font-size="10.5" fill="#17181c" text-anchor="middle">
    <text x="100" y="162">4200</text>
    <text x="156.7" y="145">5100</text>
    <text x="213.3" y="196">3800</text>
    <text x="270" y="122">6300</text>
    <text x="326.7" y="105">7200</text>
    <text x="383.3" y="69">9100</text>
    <text x="440" y="78">8600</text>
  </g>

  <!-- 横轴 -->
  <g font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c" text-anchor="middle">
    <text x="100" y="268">周一</text>
    <text x="156.7" y="268">周二</text>
    <text x="213.3" y="268">周三</text>
    <text x="270" y="268">周四</text>
    <text x="326.7" y="268">周五</text>
    <text x="383.3" y="268">周六</text>
    <text x="440" y="268">周日</text>
  </g>

  <!-- 最陡的一段：周三到周四 -->
  <line x1="213.3" y1="177.8" x2="270" y2="130.3" stroke="#8f2419" stroke-width="3.6" stroke-linecap="round"/>

  <text x="240" y="292" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">加粗的那一段最陡：6300 − 3800 = 2500，一周里涨得最猛</text>
  <text x="240" y="312" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">点的高度看「有多少」，线的陡缓看「变得有多快」</text>
</svg>
