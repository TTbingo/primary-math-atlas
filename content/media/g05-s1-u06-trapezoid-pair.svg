<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img">
  <defs>
    <marker id="arTZ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f2419"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="320" fill="#fffdf8"/>
  <text x="280" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">两个完全一样的梯形，旋转 180° 拼成平行四边形</text>

  <!-- 左：一个梯形 -->
  <polygon points="50,220 190,220 160,130 90,130" fill="#f5ddd8" stroke="#8f2419" stroke-width="2"/>
  <line x1="90" y1="130" x2="90" y2="220" stroke="#8f2419" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M90,208 L102,208 L102,220" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <text x="76" y="180" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#8f2419">h</text>

  <g stroke="#c0392b" stroke-width="1.4" fill="none">
    <line x1="90" y1="116" x2="160" y2="116"/>
    <line x1="90" y1="110" x2="90" y2="122"/>
    <line x1="160" y1="110" x2="160" y2="122"/>
  </g>
  <text x="125" y="108" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">上底 a</text>

  <g stroke="#c0392b" stroke-width="1.4" fill="none">
    <line x1="50" y1="236" x2="190" y2="236"/>
    <line x1="50" y1="230" x2="50" y2="242"/>
    <line x1="190" y1="230" x2="190" y2="242"/>
  </g>
  <text x="120" y="256" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">下底 b</text>
  <text x="120" y="278" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">一个梯形</text>

  <!-- 箭头 -->
  <line x1="204" y1="172" x2="262" y2="172" stroke="#8f2419" stroke-width="1.6" marker-end="url(#arTZ)"/>
  <text x="233" y="152" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#8f2419">旋转 180°</text>
  <text x="233" y="196" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#17181c">倒过来拼</text>

  <!-- 右：拼成的平行四边形 -->
  <polygon points="300,220 440,220 410,130 340,130" fill="#f5ddd8" stroke="#17181c" stroke-width="1.6"/>
  <polygon points="410,130 550,130 510,220 440,220" fill="#efe2cf" stroke="#17181c" stroke-width="1.6"/>
  <polygon points="300,220 510,220 550,130 340,130" fill="none" stroke="#17181c" stroke-width="2"/>
  <line x1="440" y1="220" x2="410" y2="130" stroke="#9a8f7d" stroke-width="1.4" stroke-dasharray="5 4"/>

  <line x1="340" y1="130" x2="340" y2="220" stroke="#8f2419" stroke-width="1.6" stroke-dasharray="6 4"/>
  <path d="M340,208 L352,208 L352,220" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <text x="326" y="180" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#8f2419">h</text>

  <g stroke="#c0392b" stroke-width="1.4" fill="none">
    <line x1="300" y1="236" x2="510" y2="236"/>
    <line x1="300" y1="230" x2="300" y2="242"/>
    <line x1="440" y1="230" x2="440" y2="242"/>
    <line x1="510" y1="230" x2="510" y2="242"/>
  </g>
  <text x="370" y="256" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">下底 b</text>
  <text x="475" y="256" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">上底 a</text>
  <text x="425" y="278" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#17181c">平行四边形的底 = a + b</text>

  <rect x="16" y="288" width="528" height="26" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="280" y="306" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#8f2419">(a + b) × h 是两个梯形的和，一个梯形还要 ÷ 2</text>
</svg>
