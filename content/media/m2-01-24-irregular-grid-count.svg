<svg xmlns="http://www.w3.org/2000/svg" width="520" height="268" viewBox="0 0 520 268" role="img">
  <rect x="0" y="0" width="520" height="268" fill="#fffdf8"/>
  <text x="260" y="22" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">数方格估面积：满格算 1，不满格按半格算</text>

  <!-- 左：方格纸 + 树叶 -->
  <g transform="translate(20,38)">
    <!-- 方格 12x8，每格 16 -->
    <g stroke="#cfc3ae" stroke-width="0.8">
      <rect x="0" y="0" width="192" height="192" fill="#fffefb"/>
      <line x1="16" y1="0" x2="16" y2="192"/><line x1="32" y1="0" x2="32" y2="192"/>
      <line x1="48" y1="0" x2="48" y2="192"/><line x1="64" y1="0" x2="64" y2="192"/>
      <line x1="80" y1="0" x2="80" y2="192"/><line x1="96" y1="0" x2="96" y2="192"/>
      <line x1="112" y1="0" x2="112" y2="192"/><line x1="128" y1="0" x2="128" y2="192"/>
      <line x1="144" y1="0" x2="144" y2="192"/><line x1="160" y1="0" x2="160" y2="192"/>
      <line x1="176" y1="0" x2="176" y2="192"/>
      <line x1="0" y1="16" x2="192" y2="16"/><line x1="0" y1="32" x2="192" y2="32"/>
      <line x1="0" y1="48" x2="192" y2="48"/><line x1="0" y1="64" x2="192" y2="64"/>
      <line x1="0" y1="80" x2="192" y2="80"/><line x1="0" y1="96" x2="192" y2="96"/>
      <line x1="0" y1="112" x2="192" y2="112"/><line x1="0" y1="128" x2="192" y2="128"/>
      <line x1="0" y1="144" x2="192" y2="144"/><line x1="0" y1="160" x2="192" y2="160"/>
      <line x1="0" y1="176" x2="192" y2="176"/>
    </g>
    <!-- 满格（深绿） -->
    <g fill="#4a7c59" fill-opacity="0.75">
      <rect x="64" y="32" width="16" height="16"/><rect x="80" y="32" width="16" height="16"/>
      <rect x="96" y="32" width="16" height="16"/>
      <rect x="48" y="48" width="16" height="16"/><rect x="64" y="48" width="16" height="16"/>
      <rect x="80" y="48" width="16" height="16"/><rect x="96" y="48" width="16" height="16"/>
      <rect x="112" y="48" width="16" height="16"/>
      <rect x="48" y="64" width="16" height="16"/><rect x="64" y="64" width="16" height="16"/>
      <rect x="80" y="64" width="16" height="16"/><rect x="96" y="64" width="16" height="16"/>
      <rect x="112" y="64" width="16" height="16"/>
      <rect x="64" y="80" width="16" height="16"/><rect x="80" y="80" width="16" height="16"/>
      <rect x="96" y="80" width="16" height="16"/>
      <rect x="80" y="96" width="16" height="16"/>
    </g>
    <!-- 不满格（浅黄） -->
    <g fill="#e8c46a" fill-opacity="0.7">
      <rect x="48" y="32" width="16" height="16"/><rect x="112" y="32" width="16" height="16"/>
      <rect x="32" y="48" width="16" height="16"/><rect x="128" y="48" width="16" height="16"/>
      <rect x="32" y="64" width="16" height="16"/><rect x="128" y="64" width="16" height="16"/>
      <rect x="48" y="80" width="16" height="16"/><rect x="112" y="80" width="16" height="16"/>
      <rect x="64" y="96" width="16" height="16"/><rect x="96" y="96" width="16" height="16"/>
      <rect x="80" y="112" width="16" height="16"/><rect x="64" y="112" width="16" height="16"/>
    </g>
    <!-- 叶脉 -->
    <path d="M 80 176 L 80 32" stroke="#2f5d3f" stroke-width="1.6" fill="none"/>
    <path d="M 80 152 L 56 128 M 80 128 L 104 112 M 80 104 L 60 84 M 80 84 L 100 68" stroke="#2f5d3f" stroke-width="1" fill="none"/>
    <!-- 轮廓 -->
    <path d="M 80 176 Q 40 150 32 112 Q 24 60 80 28 Q 136 60 128 112 Q 120 150 80 176 Z" fill="none" stroke="#2f5d3f" stroke-width="1.8"/>
    <text x="96" y="212" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#8a8578">每格 1 平方厘米</text>
  </g>

  <!-- 右：统计与算式 -->
  <g transform="translate(250,52)" font-family="'Noto Serif SC','Songti SC',serif">
    <rect x="0" y="0" width="250" height="150" fill="#fdf6e8" stroke="#cfc3ae" stroke-width="1"/>
    <rect x="14" y="20" width="18" height="18" fill="#4a7c59" fill-opacity="0.75"/>
    <text x="40" y="34" font-size="13" fill="#17181c">满格 14 个 × 1 = 14</text>
    <rect x="14" y="52" width="18" height="18" fill="#e8c46a" fill-opacity="0.7"/>
    <text x="40" y="66" font-size="13" fill="#17181c">不满格 12 个 × 0.5 = 6</text>
    <line x1="14" y1="84" x2="236" y2="84" stroke="#cfc3ae" stroke-width="1"/>
    <text x="14" y="106" font-size="14" fill="#17181c">14 + 6 = <tspan fill="#c0392b" font-size="16">20</tspan> 平方厘米</text>
    <text x="14" y="132" font-size="12" fill="#8a8578">这是估算，不是精确值</text>
  </g>
  <text x="260" y="232" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#555962">格子越小，估得越准；结果要写「约」</text>
</svg>
