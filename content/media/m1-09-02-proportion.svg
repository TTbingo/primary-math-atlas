<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">正比例看「比值」，反比例看「乘积」</text>
  <line x1="50" y1="240" x2="240" y2="240" stroke="#17181c" stroke-width="1.3"/>
  <line x1="50" y1="240" x2="50" y2="56" stroke="#17181c" stroke-width="1.3"/>
  <line x1="50" y1="240" x2="230" y2="60" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="80" cy="210" r="3.4" fill="#c0392b"/>
  <text x="80" y="200" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">(1,2)</text>
  <circle cx="110" cy="180" r="3.4" fill="#c0392b"/>
  <text x="110" y="170" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">(2,4)</text>
  <circle cx="140" cy="150" r="3.4" fill="#c0392b"/>
  <text x="140" y="140" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">(3,6)</text>
  <circle cx="170" cy="120" r="3.4" fill="#c0392b"/>
  <text x="170" y="110" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">(4,8)</text>
  <circle cx="200" cy="90" r="3.4" fill="#c0392b"/>
  <text x="200" y="80" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">(5,10)</text>
  <text x="44" y="256" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">0</text>
  <text x="80" y="256" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">1</text>
  <text x="44" y="214" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">2</text>
  <text x="110" y="256" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">2</text>
  <text x="44" y="184" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">4</text>
  <text x="140" y="256" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">3</text>
  <text x="44" y="154" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">6</text>
  <text x="170" y="256" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">4</text>
  <text x="44" y="124" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">8</text>
  <text x="200" y="256" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">5</text>
  <text x="44" y="94" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="9.5" fill="#7a7266">10</text>
  <text x="244" y="244" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7a7266">x</text>
  <text x="42" y="54" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7a7266">y</text>
  <text x="150" y="44" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">y / x = 2（一定）</text>
  <line x1="290" y1="70" x2="470" y2="70" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="290" y1="100" x2="470" y2="100" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="290" y1="130" x2="470" y2="130" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="290" y1="160" x2="470" y2="160" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="290" y1="190" x2="470" y2="190" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="290" y1="220" x2="470" y2="220" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="290" y1="70" x2="290" y2="220" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="380" y1="70" x2="380" y2="220" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="470" y1="70" x2="470" y2="220" stroke="#cfc3ae" stroke-width="1"/>
  <text x="335.0" y="90" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">x</text>
  <text x="425.0" y="90" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">y</text>
  <text x="335.0" y="120" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">1</text>
  <text x="425.0" y="120" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">12</text>
  <text x="335.0" y="150" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">2</text>
  <text x="425.0" y="150" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">6</text>
  <text x="335.0" y="180" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">3</text>
  <text x="425.0" y="180" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">4</text>
  <text x="335.0" y="210" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">6</text>
  <text x="425.0" y="210" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">2</text>
  <text x="380" y="238" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">x × y = 12（一定）</text>
  <text x="260" y="274" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">正比例：比值一定，图像是一条过原点的直线</text>
  <text x="260" y="294" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">反比例：乘积一定，一个量变大，另一个反而变小</text>
  <text x="260" y="314" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">判断前先找「什么一定」：比值一定 → 正；乘积一定 → 反</text>
</svg>
