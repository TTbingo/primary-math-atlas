<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img">
  <rect x="0" y="0" width="620" height="340" fill="#fffdf8"/>
  <text x="310" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">沿虚线对折，两边能完全重合的，才是轴对称图形</text>

  <!-- ① 长方形：2 条 -->
  <rect x="70" y="78" width="80" height="50" fill="#f2ecdc" stroke="#bfa578" stroke-width="1.4"/>
  <line x1="110" y1="62" x2="110" y2="144" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="52" y1="103" x2="168" y2="103" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="110" y="160" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c">长方形 · 2 条</text>

  <!-- ② 正方形：4 条 -->
  <rect x="280" y="73" width="60" height="60" fill="#f2ecdc" stroke="#bfa578" stroke-width="1.4"/>
  <line x1="310" y1="57" x2="310" y2="149" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="264" y1="103" x2="356" y2="103" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="272" y1="65" x2="348" y2="141" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="348" y1="65" x2="272" y2="141" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="310" y="160" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c">正方形 · 4 条</text>

  <!-- ③ 等腰三角形：1 条 -->
  <polygon points="510,70 478,133 542,133" fill="#f2ecdc" stroke="#bfa578" stroke-width="1.4"/>
  <line x1="510" y1="56" x2="510" y2="147" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="510" y="160" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c">等腰三角形 · 1 条</text>

  <!-- ④ 等边三角形：3 条 -->
  <polygon points="110,200 80,260 140,260" fill="#f2ecdc" stroke="#bfa578" stroke-width="1.4"/>
  <line x1="110" y1="186" x2="110" y2="274" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="74" y1="263" x2="131" y2="232" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="146" y1="263" x2="89" y2="232" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="110" y="292" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c">等边三角形 · 3 条</text>

  <!-- ⑤ 等腰梯形：1 条 -->
  <polygon points="286,205 334,205 350,260 270,260" fill="#f2ecdc" stroke="#bfa578" stroke-width="1.4"/>
  <line x1="310" y1="190" x2="310" y2="274" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="310" y="292" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c">等腰梯形 · 1 条</text>

  <!-- ⑥ 平行四边形：0 条 -->
  <polygon points="470,260 530,260 550,205 490,205" fill="#f2ecdc" stroke="#bfa578" stroke-width="1.4"/>
  <line x1="462" y1="196" x2="558" y2="270" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="462" y1="270" x2="558" y2="196" stroke="#c0392b" stroke-width="1.8"/>
  <text x="510" y="292" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">平行四边形 · 0 条</text>

  <text x="310" y="318" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10.5" fill="#5a5b60">虚线是对称轴：它是一条直线，两端要画到图形外面去；平行四边形沿哪条线折都对不上，不是轴对称图形</text>
</svg>
