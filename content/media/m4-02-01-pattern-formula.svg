<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">从 1 开始连续加奇数，和是多少？</text>
  <circle cx="70" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="70" y="170" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">1</text>
  <text x="70" y="196" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#8f2419">=1</text>
  <text x="70" y="216" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7a7266">1×1</text>
  <circle cx="182.5" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="182.5" cy="91" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="197.5" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="197.5" cy="91" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="190" y="170" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">1+3</text>
  <text x="190" y="196" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#8f2419">=4</text>
  <text x="190" y="216" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7a7266">2×2</text>
  <circle cx="295" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="295" cy="91" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="295" cy="106" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="310" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="310" cy="91" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="310" cy="106" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="325" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="325" cy="91" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="325" cy="106" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="310" y="170" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">1+3+5</text>
  <text x="310" y="196" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#8f2419">=9</text>
  <text x="310" y="216" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7a7266">3×3</text>
  <circle cx="407.5" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="407.5" cy="91" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="407.5" cy="106" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="407.5" cy="121" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="422.5" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="422.5" cy="91" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="422.5" cy="106" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="422.5" cy="121" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="437.5" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="437.5" cy="91" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="437.5" cy="106" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="437.5" cy="121" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="452.5" cy="76" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="452.5" cy="91" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="452.5" cy="106" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="452.5" cy="121" r="5" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <text x="430" y="170" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">1+3+5+7</text>
  <text x="430" y="196" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#8f2419">=16</text>
  <text x="430" y="216" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7a7266">4×4</text>
  <text x="260" y="250" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">从 1 起，连续奇数相加，加到第 n 个，和正好是 n × n</text>
  <text x="260" y="276" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">点阵每添一层 L 形，新多的点数就是下一个奇数</text>
</svg>
