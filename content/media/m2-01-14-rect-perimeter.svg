<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">长方形和正方形的周长</text>
  <rect x="40" y="80" width="160" height="100" fill="#f7f2e6" stroke="#17181c" stroke-width="1.8"/>
  <text x="120.0" y="70" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">8 厘米</text>
  <text x="120.0" y="202" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">8 厘米</text>
  <text x="28" y="134.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">5</text>
  <text x="212" y="134.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">5</text>
  <path d="M 44,179 L 196,179" stroke="#c0392b" stroke-width="1.6"/>
  <text x="120.0" y="226" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#8f2419">(8 + 5) × 2 = 26 厘米</text>
  <text x="120.0" y="248" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">周长 = (长 + 宽) × 2</text>
  <rect x="340" y="70" width="120" height="120" fill="#f7f2e6" stroke="#17181c" stroke-width="1.8"/>
  <text x="400.0" y="60" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">6 厘米</text>
  <text x="400.0" y="212" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">6 厘米</text>
  <text x="328" y="134.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">6</text>
  <text x="472" y="134.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">6</text>
  <text x="400.0" y="236" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#8f2419">6 × 4 = 24 厘米</text>
  <text x="400.0" y="258" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#17181c">周长 = 边长 × 4</text>
  <text x="260" y="288" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">四条边一条不落地加起来，就是周长；正方形四边一样长，所以直接乘 4</text>
</svg>
