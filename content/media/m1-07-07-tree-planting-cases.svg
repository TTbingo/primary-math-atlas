<svg xmlns="http://www.w3.org/2000/svg" width="580" height="440" viewBox="0 0 580 440" role="img" aria-label="植树问题四种情形对照图">
  <rect x="0" y="0" width="580" height="440" fill="#fffdf8"/>
  <text x="290" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">段数都是 4，变的是头尾种不种、接不接上</text>

  <!-- 第一行：两端都种 -->
  <text x="16" y="100" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">两端都种</text>
  <line x1="104" y1="96" x2="464" y2="96" stroke="#cfc3ae" stroke-width="2"/>
  <g fill="#8f2419">
    <circle cx="104" cy="96" r="6"/><circle cx="194" cy="96" r="6"/><circle cx="284" cy="96" r="6"/>
    <circle cx="374" cy="96" r="6"/><circle cx="464" cy="96" r="6"/>
  </g>
  <text x="556" y="80" text-anchor="end" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">棵 = 段 + 1</text>
  <text x="284" y="122" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#6b6b6b">4 段 · 5 棵</text>

  <!-- 第二行：只种一端 -->
  <text x="16" y="180" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">只种一端</text>
  <line x1="104" y1="176" x2="464" y2="176" stroke="#cfc3ae" stroke-width="2"/>
  <g fill="#8f2419">
    <circle cx="104" cy="176" r="6"/><circle cx="194" cy="176" r="6"/><circle cx="284" cy="176" r="6"/>
    <circle cx="374" cy="176" r="6"/>
  </g>
  <circle cx="464" cy="176" r="6" fill="none" stroke="#b9b0a0" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="556" y="160" text-anchor="end" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">棵 = 段</text>
  <text x="284" y="202" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#6b6b6b">4 段 · 4 棵</text>

  <!-- 第三行：两端都不种 -->
  <text x="16" y="260" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">两端不种</text>
  <line x1="104" y1="256" x2="464" y2="256" stroke="#cfc3ae" stroke-width="2"/>
  <g fill="#8f2419">
    <circle cx="194" cy="256" r="6"/><circle cx="284" cy="256" r="6"/><circle cx="374" cy="256" r="6"/>
  </g>
  <circle cx="104" cy="256" r="6" fill="none" stroke="#b9b0a0" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="464" cy="256" r="6" fill="none" stroke="#b9b0a0" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="556" y="240" text-anchor="end" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">棵 = 段 − 1</text>
  <text x="284" y="282" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#6b6b6b">4 段 · 3 棵</text>

  <!-- 第四行：围成一圈 -->
  <text x="16" y="392" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">围成一圈</text>
  <ellipse cx="284" cy="372" rx="160" ry="44" fill="none" stroke="#cfc3ae" stroke-width="2"/>
  <g fill="#8f2419">
    <circle cx="444" cy="372" r="6"/><circle cx="284" cy="328" r="6"/>
    <circle cx="124" cy="372" r="6"/><circle cx="284" cy="416" r="6"/>
  </g>
  <text x="284" y="377" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#6b6b6b">4 段 · 4 棵</text>
  <text x="556" y="356" text-anchor="end" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">棵 = 段</text>
  <text x="556" y="404" text-anchor="end" font-family="'Noto Serif SC',serif" font-size="11" fill="#b9b0a0">首尾两点重合成一个</text>
</svg>
