<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img">
  <rect x="0" y="0" width="480" height="260" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">同一平面内，两条直线只有两种关系</text>

  <line x1="240" y1="40" x2="240" y2="182" stroke="#cfc3ae" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 左：平行 -->
  <text x="120" y="50" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#8f2419">① 永不相交 → 互相平行</text>
  <line x1="34" y1="86" x2="226" y2="86" stroke="#8f2419" stroke-width="2"/>
  <line x1="34" y1="132" x2="226" y2="132" stroke="#8f2419" stroke-width="2"/>
  <line x1="76" y1="86" x2="76" y2="132" stroke="#17181c" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="196" y1="86" x2="196" y2="132" stroke="#17181c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="136" y="113" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10" fill="#17181c">距离处处相等</text>
  <text x="120" y="160" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">记作 a ∥ b</text>

  <!-- 右：垂直 -->
  <text x="352" y="50" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#8f2419">② 相交成直角 → 互相垂直</text>
  <line x1="256" y1="110" x2="444" y2="110" stroke="#8f2419" stroke-width="2"/>
  <line x1="350" y1="68" x2="350" y2="152" stroke="#8f2419" stroke-width="2"/>
  <path d="M 350 96 L 364 96 L 364 110" fill="none" stroke="#17181c" stroke-width="1.4"/>
  <text x="374" y="90" font-family="'Noto Serif SC',serif" font-size="10" fill="#17181c">直角</text>
  <circle cx="350" cy="110" r="2.6" fill="#17181c"/>
  <text x="360" y="125" font-family="'Noto Serif SC',serif" font-size="9" fill="#17181c">垂足</text>
  <text x="352" y="176" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">记作 a ⊥ b</text>

  <!-- 底部提示 -->
  <rect x="40" y="204" width="400" height="38" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="240" y="228" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">前提是「同一平面内」：立交桥上下两层永不相交，却不是平行</text>
</svg>
