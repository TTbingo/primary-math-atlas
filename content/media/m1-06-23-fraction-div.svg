<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">分数除法：换个问法就懂了</text>
  <rect x="40" y="70" width="40" height="40" fill="#e8dcc4" stroke="#17181c" stroke-width="1.2"/>
  <rect x="80" y="70" width="40" height="40" fill="#e8dcc4" stroke="#17181c" stroke-width="1.2"/>
  <rect x="120" y="70" width="40" height="40" fill="#e8dcc4" stroke="#17181c" stroke-width="1.2"/>
  <rect x="160" y="70" width="40" height="40" fill="#e8dcc4" stroke="#17181c" stroke-width="1.2"/>
  <rect x="200" y="70" width="40" height="40" fill="#fffdf8" stroke="#17181c" stroke-width="1.2"/>
  <line x1="120" y1="62" x2="120" y2="118" stroke="#8f2419" stroke-width="2"/>
  <text x="40" y="60" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">4/5 平均分成 2 份</text>
  <text x="280" y="96" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#8f2419">4/5 ÷ 2 = 2/5</text>
  <text x="280" y="122" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">4 个 1/5 平分，每份 2 个 1/5</text>
  <rect x="40" y="190" width="34" height="40" fill="#cfe0d0" stroke="#17181c" stroke-width="1.2"/>
  <line x1="40" y1="190" x2="40" y2="230" stroke="#b9a888" stroke-width="1"/>
  <rect x="74" y="190" width="34" height="40" fill="#cfe0d0" stroke="#17181c" stroke-width="1.2"/>
  <line x1="74" y1="190" x2="74" y2="230" stroke="#b9a888" stroke-width="1"/>
  <rect x="108" y="190" width="34" height="40" fill="#cfe0d0" stroke="#17181c" stroke-width="1.2"/>
  <line x1="108" y1="190" x2="108" y2="230" stroke="#b9a888" stroke-width="1"/>
  <rect x="142" y="190" width="34" height="40" fill="#cfe0d0" stroke="#17181c" stroke-width="1.2"/>
  <line x1="142" y1="190" x2="142" y2="230" stroke="#b9a888" stroke-width="1"/>
  <rect x="176" y="190" width="34" height="40" fill="#fffdf8" stroke="#17181c" stroke-width="1.2"/>
  <line x1="176" y1="190" x2="176" y2="230" stroke="#b9a888" stroke-width="1"/>
  <rect x="210" y="190" width="34" height="40" fill="#fffdf8" stroke="#17181c" stroke-width="1.2"/>
  <line x1="210" y1="190" x2="210" y2="230" stroke="#b9a888" stroke-width="1"/>
  <text x="40" y="180" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">2/3 里有几个 1/6？</text>
  <text x="280" y="216" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#8f2419">2/3 ÷ 1/6 = 4</text>
  <text x="280" y="242" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">4 个 1/6 正好是 4/6，也就是 2/3</text>
  <text x="260" y="276" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#7a7266">除以一个不为 0 的数，等于乘这个数的倒数</text>
  <text x="260" y="300" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">4/5 ÷ 2 = 4/5 × 1/2 = 2/5；2/3 ÷ 1/6 = 2/3 × 6 = 4</text>
</svg>
