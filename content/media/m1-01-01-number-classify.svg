<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">小学阶段认识的数</text>
  <rect x="210" y="44" width="100" height="32" rx="3" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <text x="260.0" y="64.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">数</text>
  <line x1="260" y1="76" x2="150" y2="100" stroke="#bfa578" stroke-width="1.2"/>
  <line x1="260" y1="76" x2="390" y2="100" stroke="#bfa578" stroke-width="1.2"/>
  <rect x="90" y="100" width="120" height="32" rx="3" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <text x="150.0" y="120.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">整数</text>
  <rect x="310" y="100" width="160" height="32" rx="3" fill="#e8dcc4" stroke="#b9a888" stroke-width="1.2"/>
  <text x="390.0" y="120.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">分数、小数、百分数</text>
  <line x1="150" y1="132" x2="68" y2="180" stroke="#bfa578" stroke-width="1.2"/>
  <rect x="30" y="180" width="76" height="32" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="68.0" y="200.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">正整数</text>
  <line x1="150" y1="132" x2="154" y2="180" stroke="#bfa578" stroke-width="1.2"/>
  <rect x="116" y="180" width="76" height="32" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="154.0" y="200.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">0</text>
  <line x1="150" y1="132" x2="240" y2="180" stroke="#bfa578" stroke-width="1.2"/>
  <rect x="202" y="180" width="76" height="32" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="240.0" y="200.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">负整数</text>
  <line x1="390" y1="132" x2="336" y2="180" stroke="#bfa578" stroke-width="1.2"/>
  <rect x="304" y="180" width="64" height="32" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="336.0" y="200.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">分数</text>
  <line x1="390" y1="132" x2="410" y2="180" stroke="#bfa578" stroke-width="1.2"/>
  <rect x="378" y="180" width="64" height="32" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="410.0" y="200.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">小数</text>
  <line x1="390" y1="132" x2="484" y2="180" stroke="#bfa578" stroke-width="1.2"/>
  <rect x="452" y="180" width="64" height="32" rx="3" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.2"/>
  <text x="484.0" y="200.0" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">百分数</text>
  <text x="260" y="246" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">正整数、0、负整数都是整数；0 也是整数，但它既不是正数也不是负数</text>
  <text x="260" y="268" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">分数、小数、百分数是同一个数量的不同写法，可以互相改写</text>
  <text x="260" y="296" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">分类的标准不一样，分出来的名字也不一样；先想清楚「按什么分」</text>
</svg>
