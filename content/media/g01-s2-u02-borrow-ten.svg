<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img">
  <rect x="0" y="0" width="480" height="240" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">13 − 9 = 4：破十法就是拆开一捆</text>

  <!-- 上层：1 捆 + 3 根 -->
  <g transform="translate(60,44)">
    <g stroke="#17181c" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="46"/><line x1="7" y1="0" x2="7" y2="46"/><line x1="14" y1="0" x2="14" y2="46"/>
      <line x1="21" y1="0" x2="21" y2="46"/><line x1="28" y1="0" x2="28" y2="46"/><line x1="35" y1="0" x2="35" y2="46"/>
      <line x1="42" y1="0" x2="42" y2="46"/><line x1="49" y1="0" x2="49" y2="46"/><line x1="56" y1="0" x2="56" y2="46"/>
      <line x1="63" y1="0" x2="63" y2="46"/>
    </g>
    <rect x="-4" y="16" width="72" height="14" rx="7" fill="#f5ddd8" stroke="#8f2419" stroke-width="1.5"/>
    <text x="32" y="66" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">一捆 = 10 根</text>
    <g stroke="#17181c" stroke-width="3" stroke-linecap="round">
      <line x1="110" y1="0" x2="110" y2="46"/><line x1="120" y1="0" x2="120" y2="46"/><line x1="130" y1="0" x2="130" y2="46"/>
    </g>
    <text x="120" y="66" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">3 根散的</text>
    <text x="72" y="92" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#17181c">13 根</text>
  </g>

  <!-- 中间箭头 -->
  <g transform="translate(240,124)">
    <path d="M -60 0 L 44 0" stroke="#8f2419" stroke-width="2" fill="none"/>
    <path d="M 44 0 L 34 -6 L 34 6 Z" fill="#8f2419"/>
    <text x="-8" y="-10" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#8f2419">拆开一捆</text>
  </g>

  <!-- 下层：拆开后 10 根散的（9 根拿走）+ 3 根 -->
  <g transform="translate(36,142)">
    <g stroke="#cfc3ae" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="46"/><line x1="10" y1="0" x2="10" y2="46"/><line x1="20" y1="0" x2="20" y2="46"/>
      <line x1="30" y1="0" x2="30" y2="46"/><line x1="40" y1="0" x2="40" y2="46"/><line x1="50" y1="0" x2="50" y2="46"/>
      <line x1="60" y1="0" x2="60" y2="46"/><line x1="70" y1="0" x2="70" y2="46"/><line x1="80" y1="0" x2="80" y2="46"/>
    </g>
    <text x="40" y="62" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">拿走 9 根</text>
    <line x1="100" y1="0" x2="100" y2="46" stroke="#8f2419" stroke-width="3" stroke-linecap="round"/>
    <text x="100" y="62" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">剩 1 根</text>
    <g stroke="#17181c" stroke-width="3" stroke-linecap="round">
      <line x1="150" y1="0" x2="150" y2="46"/><line x1="160" y1="0" x2="160" y2="46"/><line x1="170" y1="0" x2="170" y2="46"/>
    </g>
    <text x="160" y="62" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">原有 3 根</text>
    <text x="85" y="84" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="14" fill="#8f2419">1 + 3 = 4，还剩 4 根</text>
  </g>

  <text x="430" y="128" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#8f2419">13 − 9 = 4</text>
</svg>
