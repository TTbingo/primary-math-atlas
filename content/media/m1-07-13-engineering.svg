  <text x="75" y="156" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">第 1 天</text>
  <text x="145" y="156" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">第 2 天</text>
  <text x="215" y="156" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">第 3 天</text>
  <text x="285" y="156" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">第 4 天</text>
  <text x="355" y="156" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">第 5 天</text>
  <text x="425" y="156" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">第 6 天</text>
  <text x="40" y="66" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#7a7266">蓝 3 格 = 甲 1 天，绿 2 格 = 乙 1 天</text>
  <text x="260" y="190" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">把总量看成 30 份（10 和 15 的最小公倍数）</text>
  <text x="260" y="218" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">甲每天 3 份、乙每天 2 份，合作每天 5 份</text>
  <text x="260" y="248" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#8f2419">30 ÷ 5 = 6（天）</text>
  <text x="260" y="278" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">也可把总量看成 1：1 ÷ (1/10 + 1/15) = 6 天</text>
  <text x="260" y="302" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">工程问题里工作总量常设为 1，效率就是 1 ÷ 天数</text>
</svg>
