<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img">
  <rect x="0" y="0" width="480" height="300" fill="#fffdf8"/>
  <text x="240" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">尺子上的 0 刻度，是量长度的起点</text>

  <!-- 铅笔：左端对齐 0 刻度，右端落在 7 厘米 -->
  <g>
    <rect x="60" y="54" width="252" height="18" rx="3" fill="#e8c86a" stroke="#c9a94e" stroke-width="1"/>
    <polygon points="48,63 60,54 60,72" fill="#f0d9b5" stroke="#c9a94e" stroke-width="1"/>
    <polygon points="48,63 55,59 55,67" fill="#3a3a3a"/>
    <line x1="60" y1="72" x2="60" y2="80" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="312" y1="72" x2="312" y2="80" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  </g>
  <text x="322" y="68" font-family="'Noto Serif SC',serif" font-size="12" fill="#8f2419">这支铅笔长 7 厘米</text>

  <!-- 尺子：0~10 厘米，每格 36px -->
  <rect x="60" y="80" width="360" height="42" fill="#fdf6e8" stroke="#cfc3ae" stroke-width="1.2"/>
  <g stroke="#5d5a52" stroke-width="1">
    <line x1="60" y1="80" x2="60" y2="98"/><line x1="96" y1="80" x2="96" y2="98"/>
    <line x1="132" y1="80" x2="132" y2="98"/><line x1="168" y1="80" x2="168" y2="98"/>
    <line x1="204" y1="80" x2="204" y2="98"/><line x1="240" y1="80" x2="240" y2="98"/>
    <line x1="276" y1="80" x2="276" y2="98"/><line x1="312" y1="80" x2="312" y2="98"/>
    <line x1="348" y1="80" x2="348" y2="98"/><line x1="384" y1="80" x2="384" y2="98"/>
    <line x1="420" y1="80" x2="420" y2="98"/>
  </g>
  <g stroke="#8d8a80" stroke-width="0.8">
    <line x1="78" y1="80" x2="78" y2="88"/><line x1="114" y1="80" x2="114" y2="88"/>
    <line x1="150" y1="80" x2="150" y2="88"/><line x1="186" y1="80" x2="186" y2="88"/>
    <line x1="222" y1="80" x2="222" y2="88"/><line x1="258" y1="80" x2="258" y2="88"/>
    <line x1="294" y1="80" x2="294" y2="88"/><line x1="330" y1="80" x2="330" y2="88"/>
    <line x1="366" y1="80" x2="366" y2="88"/><line x1="402" y1="80" x2="402" y2="88"/>
  </g>
  <g font-family="sans-serif" font-size="9" fill="#5d5a52" text-anchor="middle">
    <text x="60" y="116">0</text><text x="96" y="116">1</text><text x="132" y="116">2</text>
    <text x="168" y="116">3</text><text x="204" y="116">4</text><text x="240" y="116">5</text>
    <text x="276" y="116">6</text><text x="312" y="116">7</text><text x="348" y="116">8</text>
    <text x="384" y="116">9</text><text x="420" y="116">10</text>
  </g>
  <text x="430" y="116" font-family="'Noto Serif SC',serif" font-size="9" fill="#5d5a52">厘米</text>
  <text x="240" y="144" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">一端对准 0 刻度，另一端对着 7，铅笔就是 7 厘米</text>

  <!-- 1 米 = 100 厘米 的米条，10 大格 -->
  <text x="240" y="164" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="10" fill="#6b6b6b">1 米平均分成 10 大格，每大格 10 厘米</text>
  <g>
    <rect x="60" y="172" width="360" height="32" fill="#fffdf8" stroke="#cfc3ae" stroke-width="1.2"/>
    <g fill="#f4ece0">
      <rect x="60" y="172" width="36" height="32"/><rect x="132" y="172" width="36" height="32"/>
      <rect x="204" y="172" width="36" height="32"/><rect x="276" y="172" width="36" height="32"/>
      <rect x="348" y="172" width="36" height="32"/>
    </g>
    <rect x="60" y="172" width="360" height="32" fill="none" stroke="#cfc3ae" stroke-width="1.2"/>
    <g stroke="#cfc3ae" stroke-width="0.6">
      <line x1="96" y1="172" x2="96" y2="204"/><line x1="132" y1="172" x2="132" y2="204"/>
      <line x1="168" y1="172" x2="168" y2="204"/><line x1="204" y1="172" x2="204" y2="204"/>
      <line x1="240" y1="172" x2="240" y2="204"/><line x1="276" y1="172" x2="276" y2="204"/>
      <line x1="312" y1="172" x2="312" y2="204"/><line x1="348" y1="172" x2="348" y2="204"/>
      <line x1="384" y1="172" x2="384" y2="204"/>
    </g>
  </g>
  <g font-family="sans-serif" font-size="9" fill="#5d5a52" text-anchor="middle">
    <text x="60" y="220">0</text><text x="240" y="220">50</text><text x="420" y="220">100</text>
  </g>
  <text x="436" y="220" font-family="'Noto Serif SC',serif" font-size="9" fill="#5d5a52">厘米</text>
  <text x="240" y="252" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="16" fill="#8f2419">1 米 = 100 厘米</text>

  <!-- 身体尺 -->
  <text x="240" y="278" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c">食指宽约 1 厘米　一拃约 15 厘米　两臂张开约 1 米</text>
</svg>
