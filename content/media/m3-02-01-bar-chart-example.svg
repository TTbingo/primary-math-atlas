<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img">
  <rect x="0" y="0" width="480" height="320" fill="#fffdf8"/>
  <text x="240" y="24" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">四(1)班 40 人上学方式统计图</text>

  <!-- 网格 -->
  <g stroke="#e6ddcc" stroke-width="0.8">
    <line x1="70" y1="231" x2="450" y2="231"/>
    <line x1="70" y1="212" x2="450" y2="212"/>
    <line x1="70" y1="193" x2="450" y2="193"/>
    <line x1="70" y1="174" x2="450" y2="174"/>
    <line x1="70" y1="155" x2="450" y2="155"/>
    <line x1="70" y1="136" x2="450" y2="136"/>
    <line x1="70" y1="117" x2="450" y2="117"/>
    <line x1="70" y1="98" x2="450" y2="98"/>
    <line x1="70" y1="79" x2="450" y2="79"/>
    <line x1="70" y1="60" x2="450" y2="60"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="70" y1="60" x2="70" y2="250" stroke="#17181c" stroke-width="1.2"/>
  <line x1="70" y1="250" x2="450" y2="250" stroke="#17181c" stroke-width="1.2"/>

  <!-- 纵轴刻度 -->
  <g font-family="'Noto Serif SC',serif" font-size="10" fill="#7a7266" text-anchor="end">
    <text x="62" y="253">0</text>
    <text x="62" y="234">2</text>
    <text x="62" y="215">4</text>
    <text x="62" y="196">6</text>
    <text x="62" y="177">8</text>
    <text x="62" y="158">10</text>
    <text x="62" y="139">12</text>
    <text x="62" y="120">14</text>
    <text x="62" y="101">16</text>
    <text x="62" y="82">18</text>
    <text x="62" y="63">20</text>
  </g>
  <text x="46" y="56" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">人</text>

  <!-- 直条 -->
  <rect x="107" y="136" width="46" height="114" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="192" y="107" width="46" height="143" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="277" y="164" width="46" height="86" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="362" y="212" width="46" height="38" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>

  <!-- 条顶标数 -->
  <g font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c" text-anchor="middle">
    <text x="130" y="128">12</text>
    <text x="215" y="99">15</text>
    <text x="300" y="156">9</text>
    <text x="385" y="204">4</text>
  </g>

  <!-- 横轴类别 -->
  <g font-family="'Noto Serif SC',serif" font-size="11" fill="#17181c" text-anchor="middle">
    <text x="130" y="268">步行</text>
    <text x="215" y="268">公交</text>
    <text x="300" y="268">家长开车</text>
    <text x="385" y="268">骑车</text>
  </g>

  <!-- 刻度说明 -->
  <line x1="66" y1="212" x2="96" y2="212" stroke="#8f2419" stroke-width="1.6"/>
  <line x1="66" y1="231" x2="96" y2="231" stroke="#8f2419" stroke-width="1.6"/>

  <text x="240" y="294" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#7a7266">纵轴一格代表 2 人；直条等宽、等距、同起点，长短才能当尺子用</text>
  <text x="240" y="312" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11.5" fill="#8f2419">12 + 15 + 9 + 4 = 40，正好是全班人数</text>
</svg>
