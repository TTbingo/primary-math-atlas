<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">数位顺序表（以 352.48 为例）</text>
  <line x1="20" y1="54" x2="20" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="80" y1="54" x2="80" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="140" y1="54" x2="140" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="200" y1="54" x2="200" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="260" y1="54" x2="260" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="320" y1="54" x2="320" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="380" y1="54" x2="380" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="440" y1="54" x2="440" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="500" y1="54" x2="500" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="20" y1="54" x2="500" y2="54" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="20" y1="88" x2="500" y2="88" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="20" y1="122" x2="500" y2="122" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="20" y1="156" x2="500" y2="156" stroke="#cfc3ae" stroke-width="1"/>
  <line x1="260" y1="54" x2="260" y2="156" stroke="#c0392b" stroke-width="1.8"/>
  <text x="50.0" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">千位</text>
  <text x="50.0" y="110" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">千</text>
  <text x="50.0" y="146" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#17181c"></text>
  <text x="110.0" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">百位</text>
  <text x="110.0" y="110" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">百</text>
  <text x="110.0" y="146" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#17181c">3</text>
  <text x="170.0" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">十位</text>
  <text x="170.0" y="110" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">十</text>
  <text x="170.0" y="146" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#17181c">5</text>
  <text x="230.0" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">个位</text>
  <text x="230.0" y="110" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">一（个）</text>
  <text x="230.0" y="146" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#17181c">2</text>
  <text x="290.0" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">小数点</text>
  <text x="290.0" y="110" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">·</text>
  <text x="290.0" y="146" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#c0392b">·</text>
  <text x="350.0" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">十分位</text>
  <text x="350.0" y="110" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">十分之一</text>
  <text x="350.0" y="146" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#17181c">4</text>
  <text x="410.0" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">百分位</text>
  <text x="410.0" y="110" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">百分之一</text>
  <text x="410.0" y="146" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#17181c">8</text>
  <text x="470.0" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">千分位</text>
  <text x="470.0" y="110" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10.5" fill="#7a7266">千分之一</text>
  <text x="470.0" y="146" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#17181c"></text>
  <text x="30" y="42" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">整数部分</text>
  <text x="500" y="42" text-anchor="end" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">小数部分</text>
  <text x="260" y="190" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12.5" fill="#7a7266">每相邻两个计数单位之间的进率都是 10</text>
  <text x="260" y="214" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">10 个一是十，10 个十分之一是 1；小数点右边第一位是十分位</text>
  <text x="260" y="242" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">352.48 里，4 在十分位上表示 4 个 0.1，8 在百分位上表示 8 个 0.01</text>
  <text x="260" y="272" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">数位说的是「位置」，计数单位说的是「这一位上的 1 表示多少」</text>
</svg>
