<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img">
  <rect x="0" y="0" width="480" height="240" fill="#fffdf8"/>
  <text x="240" y="22" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">体积单位：棱长 1 的正方体</text>

  <!-- 1 cm³ -->
  <g stroke="#8f2419" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="64,112 77,99 111,99 98,112" fill="#f7e7e2"/>
    <polygon points="98,112 111,99 111,133 98,146" fill="#edcdc4"/>
    <rect x="64" y="112" width="34" height="34" fill="#fbf0ec"/>
  </g>

  <!-- 1 dm³ -->
  <g stroke="#8f2419" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="196,82 214,64 276,64 258,82" fill="#f7e7e2"/>
    <polygon points="258,82 276,64 276,126 258,144" fill="#edcdc4"/>
    <rect x="196" y="82" width="62" height="62" fill="#fbf0ec"/>
  </g>

  <!-- 1 m³ -->
  <g stroke="#8f2419" stroke-width="1.2" stroke-linejoin="round">
    <polygon points="346,52 368,30 452,30 430,52" fill="#f7e7e2"/>
    <polygon points="430,52 452,30 452,114 430,136" fill="#edcdc4"/>
    <rect x="346" y="52" width="84" height="84" fill="#fbf0ec"/>
  </g>

  <text x="81" y="166" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#5a5b60">棱长 1 cm</text>
  <text x="81" y="184" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" font-weight="bold" fill="#8f2419">1 cm³</text>

  <text x="227" y="166" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#5a5b60">棱长 1 dm</text>
  <text x="227" y="184" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" font-weight="bold" fill="#8f2419">1 dm³</text>

  <text x="388" y="166" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#5a5b60">棱长 1 m</text>
  <text x="388" y="184" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" font-weight="bold" fill="#8f2419">1 m³</text>

  <!-- 底部换算带 -->
  <rect x="20" y="192" width="440" height="40" rx="6" fill="#f7f1e6" stroke="#cfc3ae" stroke-width="1"/>
  <text x="240" y="209" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">1 dm³ = 1000 cm³　　1 m³ = 1000 dm³</text>
  <text x="240" y="226" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="12" fill="#17181c">1 dm³ = 1 L　　1 cm³ = 1 mL</text>
</svg>
