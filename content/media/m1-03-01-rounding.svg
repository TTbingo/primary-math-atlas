<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img">
  <rect x="0" y="0" width="520" height="300" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">四舍五入：看要保留的那一位的后一位</text>
  <line x1="60" y1="110" x2="460" y2="110" stroke="#17181c" stroke-width="1.8"/>
  <line x1="60" y1="103" x2="60" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="60" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.0</text>
  <line x1="100" y1="103" x2="100" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="100" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.1</text>
  <line x1="140" y1="103" x2="140" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="140" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.2</text>
  <line x1="180" y1="103" x2="180" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="180" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.3</text>
  <line x1="220" y1="103" x2="220" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="220" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.4</text>
  <line x1="260" y1="103" x2="260" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="260" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.5</text>
  <line x1="300" y1="103" x2="300" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="300" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.6</text>
  <line x1="340" y1="103" x2="340" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="340" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.7</text>
  <line x1="380" y1="103" x2="380" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="380" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.8</text>
  <line x1="420" y1="103" x2="420" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="420" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">3.9</text>
  <line x1="460" y1="103" x2="460" y2="117" stroke="#17181c" stroke-width="1.2"/>
  <text x="460" y="134" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="10" fill="#7a7266">4.0</text>
  <line x1="260" y1="80" x2="260" y2="122" stroke="#c0392b" stroke-width="2"/>
  <text x="260" y="72" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">3.5 是分界</text>
  <text x="140" y="68" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#2b6cb0">0~4 舍 → 3</text>
  <text x="380" y="68" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">5~9 入 → 4</text>
  <circle cx="220" cy="110" r="5" fill="#2b6cb0"/>
  <circle cx="260" cy="110" r="5" fill="#c0392b"/>
  <text x="260" y="178" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">3.4 保留整数 ≈ 3；3.5 保留整数 ≈ 4</text>
  <text x="260" y="212" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">≈ 是约等号，读作「约等于」，不是等号</text>
  <text x="260" y="240" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">取近似数时，末尾的 0 不能随便去掉</text>
  <text x="260" y="268" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">3.0 表示精确到十分位，3 只表示精确到个位</text>
</svg>
