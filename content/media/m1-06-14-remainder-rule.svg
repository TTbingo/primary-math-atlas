<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" role="img">
  <rect x="0" y="0" width="520" height="320" fill="#fffdf8"/>
  <text x="260" y="26" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">17 个圆片，每 5 个分一组</text>
  <rect x="20" y="60" width="136" height="58" rx="6" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.3"/>
  <circle cx="38" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="63" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="88" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="113" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="138" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="170" y="60" width="136" height="58" rx="6" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.3"/>
  <circle cx="188" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="213" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="238" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="263" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="288" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <rect x="320" y="60" width="136" height="58" rx="6" fill="#f7f2e6" stroke="#b9a888" stroke-width="1.3"/>
  <circle cx="338" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="363" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="388" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="413" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="438" cy="89" r="9" fill="#e8dcc4" stroke="#b9a888" stroke-width="1"/>
  <circle cx="478" cy="89" r="9" fill="#eed8d2" stroke="#8f2419" stroke-width="1.3"/>
  <circle cx="502" cy="89" r="9" fill="#eed8d2" stroke="#8f2419" stroke-width="1.3"/>
  <text x="478" y="136" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11" fill="#8f2419">余 2 个</text>
  <text x="260" y="158" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#17181c">17 ÷ 5 = 3 … 2，余数 2 &lt; 除数 5</text>
  <line x1="30" y1="176" x2="490" y2="176" stroke="#cfc3ae" stroke-width="1"/>
  <text x="260" y="202" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#17181c">如果写成 17 ÷ 5 = 2 … 7 呢？</text>
  <text x="260" y="228" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#17181c">余下的 7 个里还能再拿出 5 个凑成一组，其实没分完</text>
  <text x="260" y="252" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#8f2419">余数 7 比除数 5 大，说明商还能再添 1</text>
  <text x="260" y="282" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7a7266">余数一定要比除数小：余下的不够再分一组，才叫余数</text>
  <text x="260" y="306" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">验算：除数 × 商 + 余数 = 被除数，5 × 3 + 2 = 17</text>
</svg>
