  <text x="270" y="76" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">把 1 × 1 的正方形平均分成 100 格</text>
  <text x="270" y="104" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">每一小格是 0.01</text>
  <text x="270" y="132" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">横着取 0.3，竖着取 0.2</text>
  <text x="270" y="160" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#17181c">重叠部分是 3 × 2 = 6 格</text>
  <text x="270" y="196" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="14" fill="#8f2419">6 个 0.01 就是 0.06</text>
  <text x="270" y="228" text-anchor="start" font-family="'Noto Serif SC','Songti SC',serif" font-size="16" fill="#8f2419">0.3 × 0.2 = 0.06</text>
  <text x="260" y="280" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#7a7266">先按整数算 3 × 2 = 6，再看两个因数一共有 2 位小数，积就点 2 位小数</text>
  <text x="260" y="304" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="11.5" fill="#8f2419">积的小数位数 = 两个因数的小数位数之和</text>
