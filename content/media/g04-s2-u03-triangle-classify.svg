<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img">
  <rect x="0" y="0" width="480" height="320" fill="#fffdf8"/>
  <text x="240" y="22" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="15" fill="#17181c">同一批三角形，可以按角分，也可以按边分</text>

  <!-- ============ 按角分 ============ -->
  <text x="26" y="48" font-family="'Noto Serif SC',serif" font-size="13" fill="#8f2419">按角分</text>

  <!-- 锐角三角形 -->
  <polygon points="52,116 148,116 100,54" fill="#f7f2e6" stroke="#17181c" stroke-width="1.6"/>
  <path d="M62,116 A10,10 0 0 0 60,108" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <path d="M138,116 A10,10 0 0 1 140,109" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <path d="M94,64 A10,10 0 0 1 106,64" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <text x="100" y="136" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">锐角三角形</text>
  <text x="100" y="152" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">三个角都是锐角</text>

  <!-- 直角三角形 -->
  <polygon points="192,116 272,116 192,54" fill="#f7f2e6" stroke="#17181c" stroke-width="1.6"/>
  <path d="M192,104 L204,104 L204,116" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <path d="M262,116 A10,10 0 0 1 264,109" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <text x="232" y="136" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">直角三角形</text>
  <text x="232" y="152" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">有一个角是直角</text>

  <!-- 钝角三角形：钝角在左下顶点（约 107°） -->
  <polygon points="312,58 430,116 330,116" fill="#f7f2e6" stroke="#17181c" stroke-width="1.6"/>
  <path d="M325.85,102.63 A14,14 0 0 1 344,116" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <text x="355" y="101" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">钝角</text>
  <path d="M320.97,62.41 A10,10 0 0 1 314.97,67.56" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <path d="M420,116 A10,10 0 0 0 421.03,111.59" fill="none" stroke="#8f2419" stroke-width="1.2"/>
  <text x="370" y="136" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">钝角三角形</text>
  <text x="370" y="152" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">有一个角是钝角</text>

  <line x1="24" y1="168" x2="456" y2="168" stroke="#cfc3ae" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ 按边分 ============ -->
  <text x="26" y="192" font-family="'Noto Serif SC',serif" font-size="13" fill="#8f2419">按边分</text>

  <!-- 不等边 -->
  <polygon points="46,272 156,272 104,206" fill="#f7f2e6" stroke="#17181c" stroke-width="1.6"/>
  <text x="101" y="292" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">不等边三角形</text>
  <text x="101" y="308" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">三条边都不相等</text>

  <!-- 等腰 -->
  <polygon points="206,272 286,272 246,206" fill="#f7f2e6" stroke="#17181c" stroke-width="1.6"/>
  <line x1="246" y1="206" x2="246" y2="272" stroke="#8f2419" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="222.6" y1="237.4" x2="229.4" y2="241.6" stroke="#17181c" stroke-width="1.6"/>
  <line x1="262.6" y1="241.6" x2="269.4" y2="237.4" stroke="#17181c" stroke-width="1.6"/>
  <text x="246" y="292" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">等腰三角形</text>
  <text x="246" y="308" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">1 条对称轴</text>

  <!-- 等边 -->
  <polygon points="352,272 432,272 392,203" fill="#f7f2e6" stroke="#17181c" stroke-width="1.6"/>
  <line x1="368.5" y1="235.5" x2="375.5" y2="239.5" stroke="#17181c" stroke-width="1.6"/>
  <line x1="408.5" y1="239.5" x2="415.5" y2="235.5" stroke="#17181c" stroke-width="1.6"/>
  <line x1="392" y1="268" x2="392" y2="276" stroke="#17181c" stroke-width="1.6"/>
  <text x="392" y="292" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="13" fill="#17181c">等边三角形</text>
  <text x="392" y="308" text-anchor="middle" font-family="'Noto Serif SC',serif" font-size="11" fill="#8f2419">3 条对称轴</text>

  <text x="252" y="192" font-family="'Noto Serif SC',serif" font-size="11" fill="#7a7266">边上的短横线表示「这两条边一样长」</text>
</svg>
