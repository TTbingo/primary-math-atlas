<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" font-family="'Noto Serif SC','Songti SC',serif">
  <defs>
    <marker id="arUnfold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f2419"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="300" fill="#fffdf8"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#17181c">沿一条竖线剪开，侧面展开就是一个长方形</text>

  <!-- 左：圆柱 -->
  <path d="M72,100 L72,208 A58,16 0 0 0 188,208 L188,100" fill="#fdfdfb"/>
  <path d="M72,100 L72,208 A58,16 0 0 0 188,208 L188,100" fill="none" stroke="#17181c" stroke-width="2"/>
  <ellipse cx="130" cy="100" rx="58" ry="16" fill="#f5ddd8" stroke="#17181c" stroke-width="2"/>
  <line x1="130" y1="100" x2="188" y2="100" stroke="#c0392b" stroke-width="1.4"/>
  <circle cx="130" cy="100" r="2" fill="#c0392b"/>
  <text x="156" y="94" text-anchor="middle" font-size="12" fill="#c0392b">r</text>
  <!-- 剪开的竖线 -->
  <line x1="72" y1="100" x2="72" y2="208" stroke="#8f2419" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="58" y="152" text-anchor="middle" font-size="11" fill="#8f2419" transform="rotate(-90 58 152)">这里剪一刀</text>
  <!-- 高 -->
  <g stroke="#c0392b" stroke-width="1.3" fill="none">
    <line x1="204" y1="100" x2="204" y2="208"/>
    <line x1="198" y1="100" x2="210" y2="100"/>
    <line x1="198" y1="208" x2="210" y2="208"/>
  </g>
  <text x="218" y="154" text-anchor="middle" font-size="12" fill="#c0392b" transform="rotate(-90 218 154)">高 h</text>
  <text x="130" y="240" text-anchor="middle" font-size="11.5" fill="#17181c">圆柱：底面半径 r、高 h</text>

  <!-- 箭头 -->
  <path d="M246,154 L286,154" fill="none" stroke="#8f2419" stroke-width="1.8" marker-end="url(#arUnfold)"/>
  <text x="266" y="144" text-anchor="middle" font-size="11" fill="#8f2419">撕下摊平</text>

  <!-- 右：长方形 -->
  <rect x="300" y="98" width="230" height="110" fill="#f5ddd8" stroke="#17181c" stroke-width="2"/>
  <line x1="330" y1="98" x2="330" y2="208" stroke="#8f2419" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="300" y1="98" x2="300" y2="208" stroke="#8f2419" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="415" y="150" text-anchor="middle" font-size="12" fill="#8f2419">纸还是那张纸</text>
  <text x="415" y="170" text-anchor="middle" font-size="11" fill="#17181c">面积一点没变</text>

  <!-- 长 -->
  <g stroke="#c0392b" stroke-width="1.3" fill="none">
    <line x1="300" y1="224" x2="530" y2="224"/>
    <line x1="300" y1="218" x2="300" y2="230"/>
    <line x1="530" y1="218" x2="530" y2="230"/>
  </g>
  <text x="415" y="242" text-anchor="middle" font-size="12" fill="#c0392b">长 = 底面周长 = 2πr</text>
  <!-- 宽 -->
  <text x="518" y="153" text-anchor="middle" font-size="12" fill="#c0392b" transform="rotate(-90 518 153)">宽 = 高 h</text>

  <rect x="16" y="258" width="528" height="28" rx="4" fill="#f5ddd8" stroke="#cfc3ae"/>
  <text x="280" y="277" text-anchor="middle" font-size="13" fill="#8f2419">S侧 = 2πr × h　　S表 = 2πrh + 2πr²（再加两个圆底）</text>
</svg>
